<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1c18" />
      <stop offset="100%" stop-color="#0f0e0c" />
    </linearGradient>
    <linearGradient id="zhuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e25a3d" />
      <stop offset="100%" stop-color="#c6412a" />
    </linearGradient>
    <filter id="inkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Inkstone Slab (砚台基座) -->
  <rect x="48" y="48" width="416" height="416" rx="64" fill="url(#inkGrad)" stroke="#3a342c" stroke-width="6" filter="url(#inkShadow)" />

  <!-- Ink Pool Rim (墨池内凹) -->
  <rect x="88" y="88" width="336" height="336" rx="44" fill="#141210" stroke="#25211b" stroke-width="4" />

  <!-- Inner Ink Well (磨墨深池) -->
  <rect x="120" y="120" width="272" height="180" rx="28" fill="#0b0a09" stroke="#1d1a16" stroke-width="3" />

  <!-- Cinnabar Seal Stamp (朱砂印章「砚」) -->
  <rect x="196" y="324" width="120" height="56" rx="12" fill="url(#zhuGrad)" stroke="#a53420" stroke-width="2" />

  <!-- Stylized Seal Text / Emblem -->
  <text x="256" y="362" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="30" font-weight="700" fill="#fff7f0" text-anchor="middle" letter-spacing="4">PIWIN</text>

  <!-- Fine Gold Rim Accent (金石饰线) -->
  <circle cx="256" cy="210" r="48" fill="none" stroke="#e7b352" stroke-width="3" stroke-dasharray="6 4" opacity="0.75" />
  <circle cx="256" cy="210" r="16" fill="#e25a3d" opacity="0.85" />
</svg>
