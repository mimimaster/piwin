<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- 朱砂印泥质感渐变 -->
    <linearGradient id="seal-grad" x1="15%" y1="12%" x2="85%" y2="88%">
      <stop offset="0%" stop-color="#d4553d" />
      <stop offset="60%" stop-color="#c6412a" />
      <stop offset="100%" stop-color="#a53420" />
    </linearGradient>
    <!-- 印章微阴影 -->
    <filter id="seal-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#841f12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 印台基座 (朱砂方印) -->
  <rect x="10" y="10" width="80" height="80" rx="18" fill="url(#seal-grad)" filter="url(#seal-shadow)" />
  
  <!-- 金石边框凹槽 -->
  <rect x="15" y="15" width="70" height="70" rx="13" stroke="#fff7f0" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="140 3" stroke-linecap="round" />

  <!-- 阴刻「砚」篆体意象线条 (石 + 见) -->
  <g stroke="#fff7f0" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 左侧「石」意象 -->
    <!-- 厂字头 -->
    <path d="M26 33 H44" />
    <path d="M35 33 Q29 44 26 53" />
    <!-- 口字底 -->
    <rect x="29" y="52" width="13" height="15" rx="2" stroke-width="3.8" />

    <!-- 中间金石竖弦断隔 -->
    <path d="M48 27 V73" stroke-width="1.8" stroke-opacity="0.3" stroke-dasharray="2 3" />

    <!-- 右侧「见」意象 -->
    <!-- 目字头 -->
    <rect x="54" y="30" width="18" height="23" rx="2" stroke-width="3.8" />
    <path d="M54 38 H72" stroke-width="3.2" />
    <path d="M54 45 H72" stroke-width="3.2" />
    <!-- 撇与竖弯钩 -->
    <path d="M59 55 Q55 64 51 70" stroke-width="3.8" />
    <path d="M67 55 V65 Q67 71 74 71" stroke-width="3.8" />
  </g>

  <!-- 印章角部朱泥斑驳韵味点缀 -->
  <circle cx="21" cy="21" r="1.5" fill="#fff7f0" fill-opacity="0.5" />
  <circle cx="77" cy="78" r="1.2" fill="#fff7f0" fill-opacity="0.4" />
</svg>
