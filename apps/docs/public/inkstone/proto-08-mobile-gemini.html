.day-rule { display: flex; align-items: center; justify-content: center; font: 10.5px var(--mono); color: var(--t4); margin: 14px 0 10px; text-align: center; } .day-rule::before, .day-rule::after { content: ""; flex: 1; height: 1px; background: var(--l2); margin: 0 10px; }
.command { background: var(--code); padding: 8px 10px; border-radius: 6px; font: 11px/1.7 var(--mono); color: var(--t1); overflow-x: auto; margin: 8px 0; white-space: pre-wrap; word-break: break-all; }

.agent-line { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 0; border-bottom: 1px solid var(--l1); } .agent-line:last-child { border-bottom: 0; } .agent-line strong { font-size: 13px; font-weight: 500; display: block; } .agent-line small { font-size: 11px; color: var(--t3); display: block; margin-top: 2px; } .agent-line time { font-size: 10.5px; color: var(--t4); margin-left: auto; }
.monogram { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 12px var(--serif); background: var(--s2); border: 1px solid var(--l2); flex: none; }

.lineage { display: flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 11.5px; color: var(--t3); background: var(--s1); border-bottom: 1px solid var(--l1); text-align: left; width: 100%; box-sizing: border-box; }
.host-line { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--t3); padding: 1px 4px; border-radius: 4px; } .host-line:hover { background: var(--s1); }

.cite { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--zhu-wash); color: var(--zhu); font: 9px var(--mono); vertical-align: super; margin: 0 2px; cursor: pointer; }
.wikilink { color: var(--zhu); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.note-paper { border: 1px solid var(--l2); background: var(--s3); padding: 18px 16px; margin: 12px 0; border-radius: 8px; box-shadow: var(--sh1); text-align: left; width: 100%; box-sizing: border-box; }
.note-paper h3 { font: 500 18px/1.45 var(--serif); margin: 12px 0 8px; } .note-paper p { font-size: 13px; line-height: 1.8; color: var(--t2); } .note-paper hr { border: 0; border-top: 1px solid var(--l2); margin: 14px 0; }

.more-hint { font-size: 11px; color: var(--t4); text-align: center; margin: 14px 0 8px; font-style: italic; }
.msg-chips { display: inline-flex; margin-left: 6px; vertical-align: middle; }
.files-bar { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border-radius: 7px; background: var(--s3); border: 1px solid var(--l2); font-size: 12px; color: var(--t2); margin: 10px 0; text-align: left; box-sizing: border-box; }
.branch-switch { display: inline-flex; align-items: center; gap: 4px; font: 10.5px var(--mono); color: var(--t3); margin: 0 8px; } .branch-switch button { padding: 0 4px; font-size: 12px; color: var(--t2); }
.handover { background: var(--s3); border: 1px solid var(--lamp); border-radius: 8px; padding: 12px 14px; margin: 12px 0; text-align: left; } .handover p { font: 13.5px/1.6 var(--serif); margin: 6px 0 10px; }

.mini-progress { height: 3px; background: var(--l2); border-radius: 2px; overflow: hidden; margin: 6px 0 14px; } .mini-progress span { display: block; height: 100%; background: var(--pine); border-radius: 2px; }

.banner-offline { background: var(--zhu-wash); color: var(--zhu); padding: 6px 14px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; flex: none; width: 100%; box-sizing: border-box; } .banner-offline button { color: var(--zhu); text-decoration: underline; font-size: 11px; }
.tone-lamp { color: var(--ochre); } .tone-zhu { color: var(--zhu); } .tone-crimson { color: var(--crimson); }
.context-note { font-size: 11px; color: var(--t3); margin: 8px 0 12px; display: flex; align-items: center; gap: 6px; }
.chat-scroll { padding-top: 10px; padding-bottom: 28px; width: 100%; box-sizing: border-box; }
.wiki-list { width: 100%; }
/* Flashcard (纸卡) with paper grain, Songti serif typography, & FSRS 4-grade rating */
.flashcard { display: flex; flex-direction: column; justify-content: space-between; min-height: 290px; width: 100%; text-align: left; background: var(--s3); box-shadow: var(--sh2); border: 1px solid var(--l2); padding: 22px 20px; border-radius: 8px; margin: 14px 0; cursor: pointer; position: relative; }
.flashcard::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .025; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>") 0 0/200px 200px; }
.flashcard h2 { font: 500 24px/1.65 var(--serif); color: var(--t1); margin: 22px 0 14px; letter-spacing: -.01em; } .flashcard p { font: 14.5px/1.9 var(--serif); color: var(--t1); }
.rating-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 4px; }
.rating-grid button { border: 1px solid var(--l2); border-radius: 6px; padding: 9px 0; background: var(--s3); font-size: 12px; font-weight: 500; color: var(--t1); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rating-grid button:hover { background: var(--s2); border-color: var(--l3); }

/* Unified Diff Card matching proto-10 */
.diff-card { border: 1px solid var(--l2); border-radius: 8px; overflow: hidden; margin: 10px 0; background: var(--s3); box-shadow: var(--sh1); text-align: left; }
.diff-heading { display: flex; justify-content: space-between; align-items: center; gap: 6px; font: 10.5px var(--mono); padding: 8px 12px; background: var(--s1); border-bottom: 1px solid var(--l1); color: var(--t2); }

.diff-line { display: flex; gap: 8px; padding: 0 8px; min-width: max-content; white-space: pre; color: var(--t2); } .diff-line em { color: var(--t4); font-style: normal; width: 20px; text-align: right; flex: none; user-select: none; }
.diff-line.add { background: var(--pine-wash); color: var(--t1); } .diff-line.remove { background: var(--crimson-wash); color: var(--crimson); } .diff-line.commentable { cursor: pointer; } .diff-line.commentable:hover { outline: 1px dashed var(--zhu); }
/* Subagent cards matching proto-11 */
.subagent-card { background: var(--s3); border: 1px solid var(--l2); border-radius: 8px; padding: 12px 14px; margin: 10px 0; box-shadow: var(--sh1); text-align: left; }
.candidate-card { background: var(--s3); border: 1px solid var(--l2); border-radius: 8px; padding: 12px 14px; margin: 10px 0; box-shadow: var(--sh2); text-align: left; position: relative; }
.candidate-card::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--pine); }
.step-bar { display: flex; gap: 3px; margin: 8px 0 4px; } .step-bar i { flex: 1; height: 3px; border-radius: 2px; background: var(--l2); } .step-bar i.on { background: var(--pine); } .step-bar i.now { background: var(--lamp); animation: breathe 2s infinite; }
/* Sessions list & Sidebar Tree matching proto-00 & proto-09 */
.session-item { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border-radius: 8px; background: var(--s3); box-shadow: var(--sh1); margin-bottom: 6px; position: relative; }
.session-item:hover { background: var(--s4); box-shadow: var(--sh2); } .session-item.sel { border-left: 3px solid var(--zhu); }
.session-open { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.session-open strong { font: 500 13.5px/1.4 var(--serif); color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 4px; }

<script>
/* pages.js */
/* Home lists, cross-session activity, and the conversation surface. */
(() => {
  const I = Inkstone;
  const { state, escape, icon, iconButton, dot, pill, row, header, heading, tabs, segmented, fullButton, offlineBanner, pages } = I;
  const sessionRow = (item) => { const st = I.status(item.id); return `<div class="session-item">${dot(st.dot)}<button class="session-open" data-action="open-session" data-value="${item.id}"><strong>${state.pinned.includes(item.id) ? icon('pin', 'inline-pin') : ''}${escape(I.title(item.id))}</strong><small><span class="${st.tone || ''}">${st.text}</span><span>· ${item.time}</span></small></button>${iconButton('more', `${I.title(item.id)}的更多操作`, 'session-menu', item.id)}</div>`; };
  const group = (label, list, tree = false) => list.length ? `<div class="group-label"><span>${label}</span><span>${list.length}</span></div><div class="${tree ? 'session-tree' : 'session-list'}">${list.map(sessionRow).join('')}</div>` : '';

  pages.sessions = () => {
    const live = I.sessions().filter((item) => !state.archived.includes(item.id));
    const chat = live.filter((item) => item.mode === 'chat'), code = live.filter((item) => item.mode === 'code');
    const pinned = (item) => state.pinned.includes(item.id);
    const items = I.attention();
    const attention = items.length ? `<button class="attention" data-action="navigate" data-value="activity"><span class="seal-mini" aria-hidden="true">待</span><span class="grow"><strong>${items.length} 件事等你落笔</strong><small>${items.slice(0, 2).map((item) => `${escape(I.title(item.session))} · ${item.label}`).join('；')}</small></span>${icon('chevr')}</button>` : '';
    const resume = state.run !== 'idle' && !state.archived.includes('memory') ? `<div class="continue-card compact"><div class="spread"><span class="eyebrow">桌面上正在进行</span>${pill(`${dot(state.run === 'running' ? 'running' : 'paused')}${state.run === 'running' ? '工作中' : '已暂停'}`)}</div><h3>${escape(I.title('memory'))}</h3><p>test-runner 正在补全恢复路径测试 · 你离开后又完成 2 步</p><div class="spread continue-meta"><span class="mono">piwin / main · 计划 2/4</span><button data-action="open-session" data-value="memory">接着看 ${icon('chevr')}</button></div></div>` : '';
    const chatPane = `${group('置顶', chat.filter(pinned))}${['今天', '昨天', '更早'].map((day) => group(day, chat.filter((item) => !pinned(item) && item.day === day))).join('')}<p class="more-hint">归档的对话在「案头 › 归档管理」</p>`;
    const projectPane = `${group('置顶', code.filter(pinned))}${[['piwin', '~/Developer/piwin'], ['piwin-docs', '~/Developer/piwin-docs']].map(([name, path]) => {
      const list = code.filter((item) => item.project === name && !pinned(item)); const collapsed = state.collapsed.includes(name);
      const trees = [...new Set(code.filter((item) => item.project === name).map((item) => item.tree))];
      return `<section class="project-block ${collapsed ? 'collapsed' : ''}"><div class="project-row"><button class="project-head" data-action="toggle-project" data-value="${name}" aria-expanded="${!collapsed}">${icon('chevd', 'chev')}${icon('folder')}<span class="grow"><strong>${name}</strong><small>${path}</small></span><span class="mono muted" style="font-size:11px">${code.filter((item) => item.project === name).length}</span></button>${iconButton('plus', `在 ${name} 中新建会话`, 'new-in-project', name)}</div>${collapsed ? '' : trees.map((tree) => { const inTree = list.filter((item) => item.tree === tree); return inTree.length ? `<div class="tree-label">${icon('branch')}${tree}${inTree[0].worktree ? '<em>worktree</em>' : ''}</div><div class="session-tree">${inTree.map(sessionRow).join('')}</div>` : ''; }).join('') + (name === 'piwin' ? '<p class="more-hint">还有 4 个更早的会话，用搜索查找</p>' : '')}</section>`;
    }).join('')}<div class="section-label"><span>更多项目</span><button data-action="sheet" data-value="projects">全部项目 · 6</button></div>${row('folderp', '打开 Host 上的文件夹', '选择目录 · 首次打开需确认信任', 'sheet', 'workspace-picker')}`;
    return `<header class="topbar"><span class="brand-seal">砚</span><div class="topbar-title"><h2>会话</h2><button class="host-line" data-action="sheet" data-value="host">${dot(state.offline ? 'waiting' : 'done')}${escape(state.hostName)}${state.offline ? ' · 已断开' : ' · 已连接'}${icon('chevd')}</button></div>${iconButton('search', '搜索会话', 'sheet', 'search')}${iconButton('plus', '新建素笺', 'navigate', 'new', 'red-fill')}</header>${offlineBanner()}<div class="screen-scroll">${attention}${resume}${segmented([['对话', chat.length], ['项目', code.length]], state.pane, 'pane', '会话分栏')}${state.pane === '对话' ? chatPane : projectPane}</div>${I.nav('sessions')}`;

  const answers = [['直到发送或手动删除', '推荐'], ['保留 24 小时', ''], ['保留 7 天', '']];
  I.questionCard = (dock) => `<article class="${dock ? 'interrupt question' : 'gate question'}"><div class="spread">${pill(`${dot('background')}Agent 正等待你的回答`, 'azure')}${dock ? `<button class="text-link quiet" data-action="answer" data-value="">取消问题</button>` : '<span class="muted mono" style="font-size:10px">2 分钟前</span>'}</div>${dock ? '' : `<p class="hint">${escape(I.title('reconnect'))}</p>`}<h3>离线时写下的草稿，要保留多久？</h3><div class="option-list">${answers.map(([label, tag]) => `<button data-action="answer" data-value="${label}">${label}${tag ? `<small>${tag}</small>` : ''}</button>`).join('')}</div><p class="hint">${dock ? '选择上方选项，或在下方砚台写自定义回答' : '也可以回到会话，写一段自己的回答'}</p></article>`;
  I.candidateCard = (compact) => state.candidate === 'pending' ? `<article class="card"><div class="spread">${pill(`${icon('fork')}doc-writer · 已交付`)}<span class="muted mono" style="font-size:10px">${escape(state.scheme)}</span></div><h3 class="card-title">候选变更：同步恢复说明</h3><ul class="check-list"><li class="ok"><b>✓</b>文档与实现的函数名一致</li><li class="ok"><b>✓</b>未改动公共接口</li><li class="warn"><b>!</b>README 里的示例路径需要确认</li></ul><div class="card-foot"><span>2 个文件 · <span class="green">+31</span> <span class="red">−4</span> · 独立工作树</span><button class="text-link" data-action="open-subagent" data-value="doc-writer">${compact ? '查看' : '看差异'} ${icon('chevr')}</button></div><div class="button-row">${fullButton('合入', 'candidate', 'merged')}${fullButton('让主代理处理', 'candidate', 'handed', 'secondary')}</div></article>` : `<div class="sealed"><span class="seal-mini ${state.candidate === 'merged' ? 'pine' : 'ghost'}">${state.candidate === 'merged' ? '合' : '交'}</span><span class="grow">${state.candidate === 'merged' ? '已合入 doc-writer 的 2 个文件' : '已交还主代理，确认 README 示例路径'}<small>审阅交付 · 刚刚</small></span></div>`;

<script>
/* app.js */
/* Local prototype controller and interaction dispatcher. */
(() => {
  const I = Inkstone;
  const { state, escape, icon, pages, sheets, scenes } = I;
  const phone = document.querySelector('.device > .phone') || document.querySelector('#phone');
  const dialog = document.querySelector('#sheet');
  const device = document.querySelector('#device');
  const savedForms = new Map();
  let currentSheet = '', previousFocus = null, toastTimer;

  function toast(msg) {
    const el = document.querySelector('#toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function positionSheet() {
    const b = device.getBoundingClientRect(), inset = window.innerWidth <= 700 ? 0 : 6;
    dialog.style.setProperty('--dialog-width', `${b.width - inset * 2}px`);
    dialog.style.setProperty('--dialog-left', `${b.left + inset}px`);
    dialog.style.setProperty('--dialog-bottom', `${Math.max(0, window.innerHeight - b.bottom + inset)}px`);
    dialog.style.setProperty('--dialog-max-height', `${Math.max(280, b.height - 76)}px`);
  }

  function paintSheet() {
    const s = sheets[currentSheet];
    if (!s) return;
    document.querySelector('#sheet-content').innerHTML = `<div class="sheet-grab"></div><div class="sheet-head"><h2 id="sheet-title">${s.title}</h2><button class="icon-button" data-action="close-sheet" aria-label="关闭">${icon('close')}</button></div><div class="sheet-body">${s.render()}</div>`;
    const v = savedForms.get(currentSheet);
    if (v) dialog.querySelectorAll('input[name],textarea[name]').forEach((input) => { if (v[input.name] !== undefined) input.value = v[input.name]; });
    positionSheet();
  }

  function openSheet(key) {
    if (!sheets[key]) { toast('演示入口暂未定义'); return; }
    if (!dialog.open) previousFocus = document.activeElement;
    currentSheet = key; paintSheet();
    if (!dialog.open) dialog.showModal();
  }

  function closeSheet() {
    if (dialog.open) dialog.close();
    currentSheet = '';
    if (previousFocus?.isConnected) previousFocus.focus({ preventScroll: true });
  }

  function sceneForRoute() {
    if (state.route === 'chat') return state.sessionId === 'reconnect' ? 2 : 1;
    const map = { sessions: 0, new: 0, activity: 3, tasks: 4, review: 5, workbench: 6, workspace: 6, knowledge: 7, 'wiki-detail': 7, cards: 8, desk: 9, settings: 9, 'settings-detail': 9, connect: 9, library: 9, automations: 9, walkthrough: 5, voice: 10 };
    return map[state.route] ?? 0;
  }

  function render() {
    const scroller = phone.querySelector('.screen-scroll'), scrollPos = scroller?.scrollTop || 0, prevRoute = phone.dataset.route;
    let content = pages[state.route] ? pages[state.route]() : pages.sessions();
    if (state.liveMini && state.route !== 'voice') {
      content = content.replace('</header>', `</header><div class="live-capsule" role="region" aria-label="Live 悬浮小部件"><button class="capsule-body" data-action="expand-live" aria-label="返回全屏 Live"><i class="dot running"></i><span class="capsule-text"><strong>Live · ${state.muted ? '已静音' : '我在听'}</strong><small>${state.muted ? '轻点麦克风开麦' : '“把刚才的恢复方案整理一下…”'}</small></span></button><div class="capsule-controls"><button class="capsule-btn ${state.muted ? 'is-muted' : ''}" data-action="toggle-live-mute" aria-label="${state.muted ? '取消静音' : '静音'}">${icon(state.muted ? 'close' : 'mic')}</button><button class="capsule-btn" data-action="expand-live" aria-label="全屏 Live">${icon('expand')}</button><button class="capsule-btn capsule-hangup" data-action="end-live" aria-label="结束 Live">${icon('close')}</button></div></div>`);
    }
    phone.innerHTML = content;
    phone.dataset.route = state.route;
    if (prevRoute === state.route) phone.querySelector('.screen-scroll')?.scrollTo(0, scrollPos);
    else if (state.route === 'chat') { const s = phone.querySelector('.screen-scroll'); if (s) s.scrollTop = s.scrollHeight; }
    const sceneIdx = Math.max(0, sceneForRoute()), scene = scenes[sceneIdx];
    document.querySelector('#scene-nav').innerHTML = scenes.map(([r, t], i) => `<button class="scene-link ${i === sceneIdx ? 'active' : ''}" data-action="nav-scene" data-value="${r}"><span class="scene-index">${String(i + 1).padStart(2, '0')}</span><span>${t}</span><span class="scene-arrow">↗</span></button>`).join('');
    document.querySelector('#scene-number').textContent = `${String(sceneIdx + 1).padStart(2, '0')} / 11`;
    document.querySelector('#scene-caption').textContent = scene[1];
    document.querySelector('#scene-notes').innerHTML = `<div class="note-rule"></div><div class="eyebrow">DESIGN NOTE / ${String(sceneIdx + 1).padStart(2, '0')}</div><h2>${scene[2]}</h2><p>${scene[3]}</p><div class="note-item"><b>${scene[4]}</b><p>${scene[5]}</p></div><div class="note-item"><b>${scene[6]}</b><p>${scene[7]}</p></div><span class="note-tag">Inkstone 纸墨 · 拇指工学</span><div class="note-bottom">桌面同构 · 离线自包含<br>PROTOTYPE GEMINI INCREMENTAL</div>`;
    document.querySelectorAll('[data-action="theme"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === document.documentElement.dataset.face)));
    if (dialog.open) positionSheet();
  }

  function navigate(route) {
    if (route === 'interrupt') { state.sessionId = 'reconnect'; route = 'chat'; }
    if (!pages[route]) return;
    closeSheet(); state.from[route] = state.route; state.route = route;
    if (location.hash !== `#${route}`) history.pushState(null, '', `#${route}`);
    render();
  }

  function theme(f) {
    document.documentElement.dataset.face = f;
    document.querySelector('meta[name="theme-color"]').content = f === 'ink' ? '#191714' : '#f8f6f0';
    render();
  }

  function online() {
    if (!state.offline) return true;
    toast('处于断线快照模式。草稿保存在本地，连回 Host 后可发送。');
    return false;
  }

  const actions = {
    navigate, sheet: openSheet, 'close-sheet': closeSheet, theme, compact: () => device.classList.toggle('compact'),
    'nav-scene': (t) => { if (t === 'interrupt' || t === 'chat:reconnect') { state.sessionId = 'reconnect'; navigate('chat'); } else if (t.startsWith('chat:')) { state.sessionId = t.split(':')[1]; navigate('chat'); } else navigate(t); },
    'open-session': (id) => { state.sessionId = id; navigate('chat'); },
    'session-menu': (id) => { state.menuSession = id; openSheet('session-menu'); },
    pane: (p) => { state.pane = p; render(); },
    'toggle-project': (n) => { state.collapsed = state.collapsed.includes(n) ? state.collapsed.filter((x) => x !== n) : [...state.collapsed, n]; render(); },
    'new-in-project': (p) => { state.freshProject = p; state.freshTarget = '项目'; navigate('new'); },
    'fresh-target': (t) => { state.freshTarget = t; render(); },
    'choose-project': (p) => { state.freshProject = p; closeSheet(); render(); toast(`已选项目：${p}`); },
    'trust-project': () => { closeSheet(); render(); toast('项目已标记为信任'); },
    'choose-model': (m) => { state.model = m; render(); if (dialog.open) paintSheet(); },
    'choose-thinking': (t) => { state.thinking = t; render(); if (dialog.open) paintSheet(); },
    'choose-run-mode': (m) => { state.runMode = m; render(); if (dialog.open) paintSheet(); },
    'choose-scheme': (s) => { state.scheme = s; render(); if (dialog.open) paintSheet(); },
    scope: (v) => { state.scope = v; render(); if (dialog.open) paintSheet(); },
    permission: (d, btn) => {
      if (!online()) return;
      const allowBtn = btn || document.querySelector('#seal-allow') || document.querySelector('[data-value="approved"]');
      if (allowBtn && d === 'approved') {
        allowBtn.classList.add('stamping');
        setTimeout(() => { allowBtn.classList.remove('stamping'); state.permission = d; closeSheet(); render(); toast(`已落印批准 · ${{ once: '仅本次', session: '本次会话', project: '此项目' }[state.scope]}`); }, 220);
        return;
      }
      state.permission = d; closeSheet(); render(); toast(d === 'approved' ? `已落印批准 · ${{ once: '仅本次', session: '本次会话', project: '此项目' }[state.scope]}` : '已拒绝执行');
    },
    answer: (v) => { if (!v) { state.question = 'dismissed'; render(); toast('已取消问题'); return; } state.question = 'answered'; state.answer = v; render(); toast(`已选择：${v}`); },
    candidate: (c) => { state.candidate = c; render(); toast(c === 'merged' ? '已合入候选变更至主工作树' : '已交还主代理继续处理'); },
    'plan-gate': (c) => { state.freshPlan = c; render(); toast(c === 'agents' ? '已派发至子代理探索' : '已在当前会话执行'); },
    'retry-failure': () => { state.failure = 'retrying'; render(); toast('正在重试…'); setTimeout(() => { state.failure = 'resolved'; render(); }, 1000); },
    toggle: (prop) => { state[prop] = !state[prop]; render(); },
    'toggle-run': () => { state.run = state.run === 'running' ? 'paused' : 'running'; render(); toast(state.run === 'running' ? '已继续运行' : '已暂停运行'); },
    'confirm-stop-run': () => { state.run = 'paused'; closeSheet(); render(); toast('已停止全部运行'); },
    send: () => {
      if (!online()) return;
      const text = state.draft.trim();
      if (!text) { if (state.run === 'running') { state.run = 'paused'; render(); toast('已暂停 Agent 运行'); } else if (state.run === 'paused') { state.run = 'running'; render(); toast('继续运行'); } return; }
      if (state.run === 'running') { state.queue.push({ session: state.sessionId, text, steer: false }); state.draft = ''; render(); toast('已加入发送队列'); return; }
      if (!state.sent[state.sessionId]) state.sent[state.sessionId] = [];
      state.sent[state.sessionId].push(text); state.draft = ''; render(); toast('消息已发送至 Host');
    },
    'edit-queue': (idx) => { const e = state.queue.splice(Number(idx), 1)[0]; if (e) { state.draft = e.text; render(); toast('已取回草稿'); } },
    'steer-queue': (idx) => { if (state.queue[idx]) { state.queue[idx].steer = true; render(); toast('已改为调整任务'); } },
    'cancel-queue': (idx) => { state.queue.splice(Number(idx), 1); render(); toast('已移除排队消息'); },
    'start-session': () => {
      const text = (document.querySelector('#new-prompt')?.value || state.draft).trim() || '新会话';
      const id = `fresh-${Date.now()}`;
      state.created.push({ id, title: text.slice(0, 16), mode: state.freshTarget === '项目' ? 'code' : 'chat', project: state.freshProject, tree: 'main', kind: 'fresh', prompt: text, time: '刚刚' });
      state.sessionId = id; state.draft = ''; navigate('chat'); toast('新会话已开启');
    },
    attach: (n) => { state.attachments.push(n); closeSheet(); render(); toast(`已附加：${n}`); },
    'remove-attachment': (idx) => { state.attachments.splice(Number(idx), 1); render(); },
    'detach-comment': (idx) => { if (state.comments[idx]) state.comments[idx].attached = false; render(); },
    'add-context': (txt) => { state.attachments.push(txt); navigate('chat'); toast('已加入砚台上下文'); },
    prefill: (txt) => { state.draft = txt; render(); },
    'prefill-goal': (txt) => { state.draft = txt; state.goalArmed = true; render(); },
    'disarm-goal': () => { state.goalArmed = false; render(); },
    'stop-goal': () => { state.goal = null; render(); toast('已结束 Goal 模式'); },
    'use-dictation': () => { const t = document.querySelector('#dictation-text')?.value || ''; state.draft = t; closeSheet(); navigate('chat'); toast('语音已转入砚台'); },
    'shrink-live': () => { state.liveMini = true; navigate(state.from['voice'] || 'chat'); toast('已收缩为悬浮小部件 · 可边说边工作'); },
    'expand-live': () => { navigate('voice'); },
    'toggle-live-mute': () => { state.muted = !state.muted; render(); toast(state.muted ? '已静音' : '我在听，你慢慢说'); },
    'end-live': () => { state.liveMini = false; state.handover = true; navigate('chat'); toast('Live 已结束 · 交接卡已放入会话'); },
    'mute-voice': () => { state.muted = !state.muted; render(); },
    'end-voice': () => { state.muted = false; state.liveMini = false; state.handover = true; navigate('chat'); toast('已生成交接卡并返回会话'); },
    'handover-draft': () => { state.draft = '把刚才的恢复方案整理一下，先列计划，不要开始修改。'; state.handover = false; render(); toast('已填入砚台草稿'); },
    'handover-send': () => {
      state.handover = false; if (!state.sent[state.sessionId]) state.sent[state.sessionId] = [];
      state.sent[state.sessionId].push('把刚才的恢复方案整理一下，先列计划，不要开始修改。'); render(); toast('交接指令已送达');
    },
    'open-tool': (t) => { state.tool = t; navigate('workspace'); },
    'open-subagent': (a) => { state.subagent = a; navigate('tasks'); },
    'open-doc': (d) => { state.doc = d; navigate('walkthrough'); },
    'cancel-subagent': (id) => { state.cancelled.push(id); render(); toast(`已取消子代理 ${id}`); },
    'submit-intervene': () => { const txt = document.querySelector('#intervene-input')?.value.trim(); if (txt) { state.queue.push({ session: state.sessionId, text: `[介入] ${txt}`, steer: true }); closeSheet(); render(); toast('介入要求已追加'); } },
    'open-comment': (loc) => { state.commentTarget = loc; openSheet('comment'); },
    'submit-comment': () => {
      const [file, line] = state.commentTarget.split(':'), text = document.querySelector('#comment-input')?.value.trim();
      if (text) { state.comments.push({ id: Date.now(), file, line: Number(line), text, attached: true }); closeSheet(); render(); toast('批注已放入砚台'); }
    },
    'remove-comment': (id) => { state.comments = state.comments.filter((c) => c.id !== Number(id)); render(); },
    'toggle-file': (f) => { state.openFiles = state.openFiles.includes(f) ? state.openFiles.filter((x) => x !== f) : [...state.openFiles, f]; render(); },
    'toggle-seen': (f) => { state.reviewed = state.reviewed.includes(f) ? state.reviewed.filter((x) => x !== f) : [...state.reviewed, f]; render(); },
    'mark-all-reviewed': () => { state.reviewed = ['session-index.ts', 'draft-store.ts', 'session-index.test.ts']; render(); toast('已全部标记看过'); },
    'knowledge-tab': (t) => { state.knowledgeTab = t; render(); },
    'wiki-category': (c) => { state.wikiCategory = c; render(); },
    'open-wiki': (id) => { state.wiki = id; navigate('wiki-detail'); },
    'toggle-mount': (m) => { state.mounts = state.mounts.includes(m) ? state.mounts.filter((x) => x !== m) : [...state.mounts, m]; render(); if (dialog.open) paintSheet(); },
    'flip-card': () => { state.cardFlipped = !state.cardFlipped; render(); },
    'rate-card': (r) => { state.studied += 1; state.cardFlipped = false; render(); toast(`评分「${r}」已同步至 Host`); },
    'next-card': () => { state.browsed += 1; state.cardFlipped = false; render(); },
    'reset-study': () => { state.studied = 0; state.cardFlipped = false; render(); },
    'study-mode': (m) => { state.studyMode = m === '计划复习' ? 'review' : 'browse'; state.cardFlipped = false; render(); },
    'set-study-mode': (m) => { state.studyMode = m; state.cardFlipped = false; navigate('cards'); },
    'submit-produce-cards': () => { closeSheet(); navigate('cards'); toast('已生成 3 张新卡片'); },
    'toggle-pin': (id) => { state.pinned = state.pinned.includes(id) ? state.pinned.filter((x) => x !== id) : [...state.pinned, id]; closeSheet(); render(); },
    'archive-session': (id) => { state.archived.push(id); closeSheet(); navigate('sessions'); toast('会话已归档'); },
    'restore-archive': () => { state.archived = []; render(); toast('已恢复归档会话'); },
    'fork-session': (id) => {
      const src = I.session(id), forkId = `fork-${Date.now()}`;
      state.created.push({ id: forkId, title: `${I.title(id)} · 分支`, mode: src.mode, project: src.project, tree: src.tree, kind: 'forked', from: id, time: '刚刚' });
      state.sessionId = forkId; closeSheet(); navigate('chat'); toast('已开启独立分支');
    },
    'export-session': () => { closeSheet(); toast('已导出会话 Markdown'); },
    'toggle-notify': (k) => { state.notify[k] = !state.notify[k]; paintSheet(); },
    'open-settings': (s) => { state.settingsSection = s; navigate('settings-detail'); },
    'save-demo': (msg) => { closeSheet(); toast(msg || '配置已保存'); },
    disconnect: () => { state.offline = true; closeSheet(); render(); toast('已模拟断线'); },
    reconnect: () => { state.offline = false; closeSheet(); render(); toast('Host 已重新连接'); },
    'pair-demo': () => { state.offline = false; closeSheet(); navigate('sessions'); toast('已接入示例 Host'); },
    'copy-report': () => { toast('报告已复制'); },
    'copy-response': () => { toast('回复已复制'); },
    'dismiss-done': (id) => { state.dismissed.push(id); render(); },
    branch: (delta) => { state.branchIndex = Math.max(1, Math.min(2, state.branchIndex + Number(delta))); render(); },
  };

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    const act = actions[btn.dataset.action];
    if (act) act(btn.dataset.value || '', btn);
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'composer-input') state.draft = e.target.value; });
  window.addEventListener('resize', positionSheet);
  new ResizeObserver(positionSheet).observe(device);
  window.addEventListener('popstate', () => { closeSheet(); let r = location.hash.slice(1); if (r === 'interrupt') { state.sessionId = 'reconnect'; r = 'chat'; } if (pages[r]) { state.route = r; render(); } });
  let initRoute = location.hash.slice(1);
  if (initRoute === 'interrupt') { state.sessionId = 'reconnect'; initRoute = 'chat'; }
  if (pages[initRoute]) state.route = initRoute;
  const face = new URLSearchParams(location.search).get('face');
  if (face === 'ink') document.documentElement.dataset.face = 'ink';
  render();
})();

</script>
</body></html>
