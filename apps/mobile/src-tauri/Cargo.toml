[package]
name = "piwin-mobile"
version = "0.0.0"
description = "Piwin mobile shell"
authors = ["piwin"]
edition = "2021"

[lib]
name = "piwin_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-barcode-scanner = "2"
tauri-plugin-keyring-store = "0.2.0"
sha2 = "0.10"
