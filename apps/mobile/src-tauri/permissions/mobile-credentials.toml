[[permission]]
identifier = "allow-mobile-credential-read"
description = "Read the paired device credential from the OS keyring."
commands.allow = ["mobile_credential_read"]

[[permission]]
identifier = "allow-mobile-credential-write"
description = "Write the paired device credential to the OS keyring."
commands.allow = ["mobile_credential_write"]

[[permission]]
identifier = "allow-mobile-credential-clear"
description = "Clear the paired device credential from the OS keyring."
commands.allow = ["mobile_credential_clear"]
