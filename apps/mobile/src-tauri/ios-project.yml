name: piwin-mobile
options:
  bundleIdPrefix: app.piwin.mobile
  deploymentTarget:
    # Native plugins already require iOS 15. Linking below 15 embeds a second
    # concurrency runtime, which crashes when ActivityKit uses the system one.
    iOS: '15.0'
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: piwin shell
      PRODUCT_BUNDLE_IDENTIFIER: app.piwin.mobile
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  piwin-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: piwin-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      - path: ../../plugins/live/ios/Sources/PiwinLiveIntents.swift
    info:
      path: piwin-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: '1.0.0.15'
        NSMicrophoneUsageDescription: '需要访问麦克风以支持语音实时转写输入'
        NSSpeechRecognitionUsageDescription: '需要语音识别权限以使用 iOS 原生语音听写功能'
        NSLocalNetworkUsageDescription: 'Piwin 需要访问局域网中的 Piwin Host，才能在手机上使用应用。'
        NSHealthShareUsageDescription: 'Piwin reads only the Apple Health categories you allow (such as steps, activity, sleep, heart rate and weight) to create the health summaries you ask for. After you agree in the app, these summaries are sent to your own Piwin Host and then to the AI model provider you configured there. Health data is never used for advertising or sold.'
        NSHealthUpdateUsageDescription: 'Piwin never writes to or changes your Apple Health data. It only reads the categories you allow to create the health summaries you ask for.'
    entitlements:
      path: ../../HealthKit.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        DEVELOPMENT_TEAM: F47G63A8DM
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      # 1.0 App Store builds strip this extension (no App Store profile for
      # app.piwin.mobile.live-activity yet) and src-tauri/Info.plist no longer sets
      # NSSupportsLiveActivities. Re-enable both together once the profile exists.
      - target: PiwinLiveActivityExtension
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: HealthKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  PiwinLiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: ../../ios/live-activity
      - path: ../../plugins/live/ios/Sources/PiwinLiveAttributes.swift
      - path: ../../plugins/live/ios/Sources/PiwinLiveIntents.swift
    info:
      path: PiwinLiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: piwin Live
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: '1.0.0.15'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.piwin.mobile.live-activity
        DEVELOPMENT_TEAM: F47G63A8DM
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.0'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
