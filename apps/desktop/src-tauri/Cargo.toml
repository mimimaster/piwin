[package]
name = "piwin-desktop"
version = "0.0.0"
description = "piwinwin desktop shell"
authors = ["piwinwin"]
edition = "2021"

[lib]
name = "piwin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Enables macOS full-size-content-view: the web titleband occupies the same
# native row as the traffic lights instead of being laid out beneath it.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-websocket = "2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# WKWebView drops sandbox child→parent DOM messages in release builds. A
# frame-scoped script message handler is the narrow native return channel.
# NSSet/NSDate + the WKWebsiteDataStore features power the memory-governor
# purge command (removeDataOfTypes:[MemoryCache]).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSURLRequest", "NSSet", "NSDate"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKFrameInfo", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord", "block2"] }
# Escaping Objective-C completion handler for the WKWebsiteDataStore purge.
# Already a transitive dependency of objc2-web-kit; declared for direct use.
block2 = "0.6"
# host_statistics64/sysctl + proc_pid_rusage sampling for the governor feed.
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[features]
default = []
shell-only = []
