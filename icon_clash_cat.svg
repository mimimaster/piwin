<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- macOS 软件图标级：Clash 风格极简极客猫 (Geometric Clash Cat Mascot) -->
  <defs>
    <linearGradient id="catBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="sunglassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="macShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#macShadow)">
    <!-- 极简几何圆润猫咪轮廓 (类似 Clash 探头/全包剪影) -->
    <path d="M 120,380 L 120,220 L 175,130 L 235,190 L 277,190 L 337,130 L 392,220 L 392,380 C 392,420 352,430 256,430 C 160,430 120,420 120,380 Z" fill="url(#catBodyGrad)"/>

    <!-- 耳朵内侧几何浅影 -->
    <polygon points="175,130 205,180 155,180" fill="#CBD5E1"/>
    <polygon points="337,130 357,180 307,180" fill="#CBD5E1"/>

    <!-- 酷黑大方框墨镜 (极简极客风) -->
    <g transform="translate(0, 10)">
      <!-- 左镜框 -->
      <rect x="155" y="210" width="85" height="56" rx="16" fill="url(#sunglassesGrad)"/>
      <!-- 右镜框 -->
      <rect x="272" y="210" width="85" height="56" rx="16" fill="url(#sunglassesGrad)"/>
      <!-- 镜梁 -->
      <rect x="236" y="222" width="40" height="10" rx="5" fill="#090D16"/>
      <!-- 极简白色倾斜高光条 -->
      <path d="M 165,220 L 195,220 L 180,256 L 165,256 Z" fill="#FFFFFF" opacity="0.45"/>
      <path d="M 282,220 L 312,220 L 297,256 L 282,256 Z" fill="#FFFFFF" opacity="0.45"/>
    </g>

    <!-- 极简得意微笑嘴 (Clean Vector Arcade Smile) -->
    <path d="M 230,305 Q 256,325 282,305" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>

    <!-- 领口极简纯金铃勋章 -->
    <circle cx="256" cy="375" r="22" fill="#F59E0B"/>
    <circle cx="256" cy="375" r="14" fill="#FEF08A"/>
    <line x1="242" y1="375" x2="270" y2="375" stroke="#D97706" stroke-width="3"/>
  </g>
</svg>
