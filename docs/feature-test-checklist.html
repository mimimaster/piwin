<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>piwin · 功能测试台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f8f8;
      --panel: #ffffff;
      --sidebar: #f3f4f5;
      --ink: #24292f;
      --ink-2: #57606a;
      --ink-3: #8c959f;
      --line: #d0d7de;
      --line-soft: #eaeef2;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
      --pass: #1a7f37;
      --pass-soft: #dafbe1;
      --fail: #cf222e;
      --fail-soft: #ffebe9;
      --skip: #9a6700;
      --skip-soft: #fff8c5;
      --blocked: #8250df;
      --blocked-soft: #fbefff;
      --todo: #656d76;
      --todo-soft: #f6f8fa;
      --warn: #9a6700;
      --danger: #cf222e;
      --radius: 8px;
      --font: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --sidebar-w: 280px;
      --detail-w: 360px;
      --header-h: 52px;
      --filter-h: 44px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      font-size: 13.5px;
      line-height: 1.45;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    ::selection { background: #b6e3ff; }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      grid-template-rows: var(--header-h) minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
    }

    /* —— Top bar —— */
    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      z-index: 30;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: calc(var(--sidebar-w) - 14px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 22px; height: 22px; border-radius: 6px;
      background: linear-gradient(135deg, #0969da, #0550ae);
      color: #fff; display: grid; place-items: center;
      font-size: 11px; font-weight: 700;
    }
    .brand small { color: var(--ink-3); font-weight: 500; margin-left: 4px; }

    .search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--ink-3); pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      height: 32px;
      padding: 0 12px 0 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(9,105,218,.15);
      background: #fff;
    }
    .kbd {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      font-family: var(--mono); font-size: 11px; color: var(--ink-3);
      border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; height: 20px;
      display: grid; place-items: center; background: #fff;
    }

    .top-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .btn {
      height: 30px; padding: 0 10px; border-radius: 6px;
      border: 1px solid var(--line); background: #fff;
      color: var(--ink); display: inline-flex; align-items: center; gap: 6px;
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: var(--bg); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #0550ae; }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
    .btn.ghost:hover { background: var(--line-soft); color: var(--ink); }
    .progress-pill {
      display: flex; align-items: center; gap: 8px;
      height: 30px; padding: 0 10px; border-radius: 999px;
      background: var(--bg); border: 1px solid var(--line);
      font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px;
    }
    .mini-bar {
      width: 72px; height: 6px; border-radius: 99px; background: #e6ebf0; overflow: hidden;
    }
    .mini-bar > i { display:block; height:100%; background: var(--pass); width:0%; transition: width .2s; }

    /* —— Sidebar —— */
    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0;
    }
    .side-section {
      padding: 12px 10px 6px;
      font-size: 11px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; color: var(--ink-3);
    }
    .side-nav {
      flex: 1; overflow: auto; padding: 0 8px 16px;
      scrollbar-width: thin;
    }
    .nav-item {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 6px;
      padding: 7px 8px;
      color: var(--ink-2);
      margin-bottom: 1px;
    }
    .nav-item:hover { background: rgba(0,0,0,.04); color: var(--ink); }
    .nav-item.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(27,31,35,.04);
      font-weight: 550;
    }
    .nav-item .name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px;
    }
    .nav-item .count {
      font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    }
    .nav-item .count.done { color: var(--pass); }
    .side-stats {
      border-top: 1px solid var(--line);
      padding: 10px 12px 14px;
      display: grid; gap: 6px;
      background: color-mix(in srgb, var(--sidebar) 80%, #fff);
    }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--ink-2);
    }
    .stat-dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px;
    }

    /* —— Main —— */
    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--detail-w);
      min-width: 0; min-height: 0;
      background: var(--panel);
    }
    .main.no-detail { grid-template-columns: 1fr; }
    .main.no-detail .detail { display: none; }

    .workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
    .filters {
      height: var(--filter-h);
      display: flex; align-items: center; gap: 6px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line-soft);
      background: #fafbfc;
      overflow-x: auto;
    }
    .chip {
      height: 26px; padding: 0 10px; border-radius: 999px;
      border: 1px solid transparent; background: transparent;
      color: var(--ink-2); font-size: 12.5px;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .chip:hover { background: #fff; border-color: var(--line); }
    .chip[aria-pressed="true"] {
      background: #fff; border-color: var(--line); color: var(--ink);
      box-shadow: 0 1px 2px rgba(27,31,35,.06);
      font-weight: 550;
    }
    .chip .n {
      font-family: var(--mono); font-size: 11px; color: var(--ink-3);
      background: var(--bg); border-radius: 999px; padding: 0 6px; height: 18px;
      display: inline-grid; place-items: center;
    }

    .list-head {
      display: grid;
      grid-template-columns: 28px 92px minmax(0,1fr) 110px 72px;
      gap: 8px;
      padding: 8px 14px;
      font-size: 11px; font-weight: 600; color: var(--ink-3);
      text-transform: uppercase; letter-spacing: .03em;
      border-bottom: 1px solid var(--line-soft);
      background: #fff;
    }
    .list {
      flex: 1; overflow: auto; scrollbar-width: thin;
    }
    .group-block { border-bottom: 1px solid var(--line-soft); }
    .group-title {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      background: color-mix(in srgb, #f6f8fa 92%, #fff);
      border-bottom: 1px solid var(--line-soft);
      backdrop-filter: blur(8px);
    }
    .group-title button {
      border: 0; background: transparent; padding: 0; color: var(--ink);
      font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px;
    }
    .group-title .meta { margin-left: auto; color: var(--ink-3); font-family: var(--mono); font-size: 11px; }

    .row {
      display: grid;
      grid-template-columns: 28px 92px minmax(0,1fr) 110px 72px;
      gap: 8px;
      align-items: center;
      padding: 0 14px;
      min-height: 40px;
      border-bottom: 1px solid var(--line-soft);
      cursor: pointer;
      transition: background .12s;
    }
    .row:hover { background: #f6f8fa; }
    .row.active { background: var(--accent-soft); }
    .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .row.hidden { display: none; }

    .check {
      width: 16px; height: 16px; border-radius: 4px;
      border: 1.5px solid var(--line); background: #fff;
      display: grid; place-items: center;
    }
    .row[data-status="pass"] .check {
      background: var(--pass); border-color: var(--pass); color: #fff;
    }
    .status {
      height: 22px; padding: 0 8px; border-radius: 999px;
      font-size: 11.5px; font-weight: 550;
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid transparent; width: fit-content;
    }
    .status.todo { background: var(--todo-soft); color: var(--todo); border-color: var(--line); }
    .status.pass { background: var(--pass-soft); color: var(--pass); }
    .status.fail { background: var(--fail-soft); color: var(--fail); }
    .status.skip { background: var(--skip-soft); color: var(--skip); }
    .status.blocked { background: var(--blocked-soft); color: var(--blocked); }

    .label {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13.5px;
    }
    .row[data-status="pass"] .label { color: var(--ink-2); }
    .tags { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; }
    .tag {
      font-size: 11px; padding: 1px 6px; border-radius: 999px;
      background: #eef2f5; color: var(--ink-2); white-space: nowrap;
    }
    .tag.warn { background: var(--skip-soft); color: var(--warn); }
    .tag.bad { background: var(--fail-soft); color: var(--fail); }
    .updated {
      font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right;
    }

    /* —— Detail —— */
    .detail {
      display: flex; flex-direction: column; min-height: 0; background: #fff;
    }
    .detail-empty {
      margin: auto; text-align: center; color: var(--ink-3); padding: 24px;
    }
    .detail-head {
      padding: 14px 16px 10px; border-bottom: 1px solid var(--line-soft);
    }
    .detail-head .id {
      font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 6px;
    }
    .detail-head h2 {
      margin: 0; font-size: 15px; line-height: 1.35; letter-spacing: -0.01em;
    }
    .detail-body { padding: 12px 16px; display: grid; gap: 14px; overflow: auto; flex: 1; }
    .field label {
      display: block; font-size: 11px; font-weight: 600; color: var(--ink-3);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
    }
    .status-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .status-grid button {
      height: 32px; border-radius: 6px; border: 1px solid var(--line);
      background: #fff; font-size: 12.5px; font-weight: 550;
    }
    .status-grid button:hover { background: var(--bg); }
    .status-grid button.active.pass { background: var(--pass-soft); border-color: #4ac26b; color: var(--pass); }
    .status-grid button.active.fail { background: var(--fail-soft); border-color: #ff8182; color: var(--fail); }
    .status-grid button.active.skip { background: var(--skip-soft); border-color: #d4a72c; color: var(--skip); }
    .status-grid button.active.blocked { background: var(--blocked-soft); border-color: #c297ff; color: var(--blocked); }
    .status-grid button.active.todo { background: var(--todo-soft); border-color: var(--line); }

    textarea.note {
      width: 100%; min-height: 140px; resize: vertical;
      border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; background: var(--bg);
      outline: none; line-height: 1.5;
    }
    textarea.note:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(9,105,218,.12);
      background: #fff;
    }
    .detail-actions {
      display: flex; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--line-soft);
    }

    .empty-list {
      padding: 48px 20px; text-align: center; color: var(--ink-3);
    }

    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #24292f; color: #fff; padding: 8px 14px; border-radius: 8px;
      font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }

    dialog {
      border: 1px solid var(--line); border-radius: 12px; padding: 0;
      width: min(420px, calc(100% - 24px)); box-shadow: 0 16px 48px rgba(0,0,0,.18);
    }
    dialog::backdrop { background: rgba(27,31,35,.4); }
    .dlg { padding: 18px; display: grid; gap: 12px; }
    .dlg h3 { margin: 0; font-size: 15px; }
    .dlg p { margin: 0; color: var(--ink-2); }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* —— 测试增强：排序 / 折叠 / 步骤勾选 / 批量 / 备份 —— */
    .filters-spacer { flex: 1; min-width: 12px; }
    .sort-select {
      height: 26px; border: 1px solid var(--line); border-radius: 999px;
      background: #fff; font-size: 12px; color: var(--ink-2); padding: 0 8px;
      outline: none; flex: none;
    }
    .sort-select:focus { border-color: var(--accent); }
    .chip.bulk { border: 1px dashed var(--line); flex: none; }
    .chip.bulk:hover { border-style: solid; }
    .chip.bulk:disabled { opacity: .45; cursor: default; }
    .detail-actions { flex-wrap: wrap; }
    .progress-pill { cursor: pointer; }
    .progress-pill:hover { border-color: var(--accent); color: var(--accent); }
    .group-chevron {
      display: inline-block; width: 12px; transition: transform .15s;
      color: var(--ink-3); font-size: 10px;
    }
    .group-block.collapsed .group-chevron { transform: rotate(-90deg); }
    .step-item { display: flex; gap: 8px; align-items: flex-start; }
    .step-check {
      width: 18px; height: 18px; flex: none; padding: 0; margin-top: 1px;
      border-radius: 4px; border: 1.5px solid var(--line); background: #fff;
      color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700;
      transition: background .12s, border-color .12s;
    }
    .step-check:hover { border-color: var(--pass); }
    .step-check.on { background: var(--pass); border-color: var(--pass); }
    .step-meta { color: var(--pass); font-weight: 600; }
    .tag.ok { background: var(--pass-soft); color: var(--pass); }
    .help-list { display: grid; gap: 6px; margin: 0; padding-left: 18px; color: var(--ink-2); }
    .help-list kbd {
      font-family: var(--mono); font-size: 11px; background: var(--bg);
      border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .brand { min-width: auto; }
      .main { grid-template-columns: 1fr; }
      .detail { position: fixed; inset: auto 0 0 0; height: 46vh; border-top: 1px solid var(--line); z-index: 40; }
      .list-head, .row { grid-template-columns: 28px 84px minmax(0,1fr); }
      .list-head .c-tags, .list-head .c-time, .row .tags, .row .updated { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">π</div>
        <div>桌面测试用例 <small>piwin</small></div>
      </div>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜索用例、步骤、期望…" autocomplete="off" />
        <span class="kbd">/</span>
      </div>
      <div class="progress-pill" id="progressPill" title="已通过 / 总数。点击可切换「只看未测」">
        <span id="progressText">0 / 0</span>
        <span class="mini-bar"><i id="progressBar"></i></span>
        <span id="progressPct">0%</span>
      </div>
      <div class="top-actions">
        <button class="btn ghost" type="button" id="toggleDetail" title="切换详情栏">详情</button>
        <button class="btn" type="button" id="reportBtn" title="导出 Markdown 测试报告">报告</button>
        <button class="btn" type="button" id="exportBtn" title="导出进度 JSON（含全部状态与备注）">导出</button>
        <button class="btn" type="button" id="importBtn" title="导入进度 JSON">导入</button>
        <button class="btn ghost" type="button" id="restoreBtn" title="恢复最近一次自动备份">恢复</button>
        <button class="btn" type="button" id="resetBtn" title="清空全部状态与备注">重置</button>
      </div>
    </header>

    <aside class="sidebar">
      <div class="side-section">分类</div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-stats" id="sideStats"></div>
    </aside>

    <section class="main" id="main">
      <div class="workspace">
        <div class="filters" id="filters" role="tablist" aria-label="状态筛选"></div>
        <div class="list-head">
          <span></span>
          <span>状态</span>
          <span>用例</span>
          <span class="c-tags">标签</span>
          <span class="c-time" style="text-align:right">更新</span>
        </div>
        <div class="list" id="list" tabindex="0" aria-label="用例列表"></div>
      </div>
      <aside class="detail" id="detail"></aside>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <dialog id="confirmDialog">
    <div class="dlg">
      <h3 id="confirmTitle">确认</h3>
      <p id="confirmMsg"></p>
      <div class="dlg-actions">
        <button class="btn" type="button" id="confirmCancel">取消</button>
        <button class="btn primary" type="button" id="confirmOk">确认</button>
      </div>
    </div>
  </dialog>
  <dialog id="helpDialog">
    <div class="dlg">
      <h3>键盘快捷键</h3>
      <ul class="help-list">
        <li><kbd>j</kbd>/<kbd>k</kbd> 或 <kbd>↑</kbd>/<kbd>↓</kbd> — 上一条 / 下一条用例</li>
        <li><kbd>Enter</kbd>/<kbd>Space</kbd> — 切换 通过 / 未测</li>
        <li><kbd>1</kbd>–<kbd>5</kbd> — 未测 / 通过 / 失败 / 跳过 / 阻塞</li>
        <li><kbd>[</kbd>/<kbd>]</kbd> — 上一组 / 下一组</li>
        <li><kbd>/</kbd> 搜索（含备注）· <kbd>Esc</kbd> 清空搜索</li>
        <li>点击行内「状态徽章」循环切换状态；点步骤圆圈逐步打勾；分组标题可折叠</li>
      </ul>
      <div class="dlg-actions">
        <button class="btn primary" type="button" id="helpClose">知道了</button>
      </div>
    </div>
  </dialog>
  <input id="importFile" type="file" accept="application/json,.json" hidden />

  
<script>

const STORAGE_KEY = "piwin.feature-test-checklist.v3";
const BACKUP_KEY = STORAGE_KEY + ".backup";

const STATUSES = [
  { id: "todo", label: "未测", short: "未测" },
  { id: "pass", label: "通过", short: "通过" },
  { id: "fail", label: "失败", short: "失败" },
  { id: "skip", label: "跳过", short: "跳过" },
  { id: "blocked", label: "阻塞", short: "阻塞" },
];

/**
 * Desktop-only acceptance cases.
 * Each item: id, title, steps[], expect
 */
const GROUPS = [
  {
    id: "start",
    title: "启动与打开项目",
    items: [
      {
        id: "start.launch",

    /** @typedef {{status:string, note:string, updatedAt?:string}} ItemState */
    /** @type {{items: Record<string, ItemState>, activeGroup:string|'all', selectedId:string|null, showDetail:boolean}} */
    let state = loadState();
    let filterStatus = "all";
    let searchQuery = "";

    const $ = (id) => document.getElementById(id);
    const allItems = GROUPS.flatMap((g) => g.items.map((item) => ({
      ...item,
      label: item.title,
      groupId: g.id,
      groupTitle: g.title,
    })));
    const itemById = Object.fromEntries(allItems.map((i) => [i.id, i]));

    function defaultItem() {
      return { status: "todo", note: "", stepsChecked: [] };
    }

    /** 归一化持久化状态；新增字段全部为增量，旧进度/备注/标记原样保留。 */
    function normalizeState(raw) {
      const s = raw || {};
      const items = {};
      for (const [k, v] of Object.entries(s.items || {})) {
        if (v && typeof v === "object") items[k] = v;
      }
      let activeGroup = s.activeGroup || "all";
      if (activeGroup !== "all" && !GROUPS.some((g) => g.id === activeGroup)) activeGroup = "all";
      return {
        items,
        activeGroup,
        selectedId: s.selectedId || null,
        showDetail: s.showDetail !== false,
        collapsedGroups: Array.isArray(s.collapsedGroups) ? s.collapsedGroups : [],
        sortMode: ["group", "todo-first", "recent"].includes(s.sortMode) ? s.sortMode : "group",
      };
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (parsed && typeof parsed === "object") return normalizeState(parsed);
      } catch {}
      return normalizeState(null);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getItemState(id) {
      const s = state.items[id];
      return s && typeof s === "object" ? { ...defaultItem(), ...s } : defaultItem();
    }

    function setItemStatus(id, status) {
      state.items[id] = { ...getItemState(id), status, updatedAt: new Date().toISOString() };
      saveState();
    }

    function setItemNote(id, note) {
      state.items[id] = { ...getItemState(id), note, updatedAt: new Date().toISOString() };
      saveState();
    }

    function setItemSteps(id, checked) {
      state.items[id] = { ...getItemState(id), stepsChecked: checked, updatedAt: new Date().toISOString() };
      saveState();
    }

    function statusLabel(id) {
      return STATUSES.find((s) => s.id === id)?.label || id;
    }

    function tagClass(tag) {
      if (tag.includes("红") || tag.includes("未上线")) return "bad";
      if (tag.includes("黄") || tag.includes("可选") || tag.includes("P1")) return "warn";
      return "";
    }

    function formatTime(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "—";
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mi = String(d.getMinutes()).padStart(2, "0");
      return `${mm}-${dd} ${hh}:${mi}`;
    }

    function counts() {
      const c = { all: 0, todo: 0, pass: 0, fail: 0, skip: 0, blocked: 0 };
      for (const item of allItems) {
        const st = getItemState(item.id).status || "todo";
        c.all += 1;
        c[st] = (c[st] || 0) + 1;
      }
      return c;
    }

    function groupCounts(groupId) {
      const items = groupId === "all" ? allItems : allItems.filter((i) => i.groupId === groupId);
      let pass = 0;
      for (const item of items) {
        if (getItemState(item.id).status === "pass") pass += 1;
      }
      return { total: items.length, pass };
    }

    function matchesFilters(item) {
      if (state.activeGroup !== "all" && item.groupId !== state.activeGroup) return false;
      const st = getItemState(item.id).status || "todo";
      if (filterStatus !== "all" && st !== filterStatus) return false;
      if (searchQuery) {
        const hay = `${item.title} ${item.id} ${(item.tags || []).join(" ")} ${item.groupTitle} ${(item.steps || []).join(" ")} ${item.expect || ""} ${getItemState(item.id).note || ""}`.toLowerCase();
        if (!hay.includes(searchQuery)) return false;
      }
      return true;
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function confirmAction(title, msg) {
      const dialog = $("confirmDialog");
      $("confirmTitle").textContent = title;
      $("confirmMsg").textContent = msg;
      dialog.showModal();
      return new Promise((resolve) => {
        const ok = $("confirmOk");
        const cancel = $("confirmCancel");
        let settled = false;
        const finish = (v) => {
          if (settled) return;
          settled = true;
          resolve(v);
        };
        dialog.addEventListener("close", () => finish(false), { once: true });
        ok.onclick = () => { dialog.close(); finish(true); };
        cancel.onclick = () => { dialog.close(); };
      });
    }

    function renderSidebar() {
      const nav = $("sideNav");
      nav.innerHTML = "";

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = `nav-item${state.activeGroup === "all" ? " active" : ""}`;
      const ac = groupCounts("all");
      allBtn.innerHTML = `<span class="name">全部用例</span><span class="count${ac.pass === ac.total ? " done" : ""}">${ac.pass}/${ac.total}</span>`;
      allBtn.onclick = () => activateGroup("all");
      nav.appendChild(allBtn);

      for (const g of GROUPS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `nav-item${state.activeGroup === g.id ? " active" : ""}`;
        const gc = groupCounts(g.id);
        btn.innerHTML = `<span class="name" title="${escapeAttr(g.title)}">${escapeHtml(g.title)}</span><span class="count${gc.pass === gc.total && gc.total ? " done" : ""}">${gc.pass}/${gc.total}</span>`;
        btn.onclick = () => activateGroup(g.id);
        nav.appendChild(btn);
      }

      const c = counts();
      $("sideStats").innerHTML = `
        <div class="stat-row"><span><span class="stat-dot" style="background:var(--pass)"></span>通过</span><strong>${c.pass}</strong></div>
        <div class="stat-row"><span><span class="stat-dot" style="background:var(--fail)"></span>失败</span><strong>${c.fail}</strong></div>
        <div class="stat-row"><span><span class="stat-dot" style="background:var(--skip)"></span>跳过</span><strong>${c.skip}</strong></div>
        <div class="stat-row"><span><span class="stat-dot" style="background:var(--blocked)"></span>阻塞</span><strong>${c.blocked}</strong></div>
        <div class="stat-row"><span><span class="stat-dot" style="background:var(--line)"></span>未测</span><strong>${c.todo}</strong></div>
      `;
    }

    function renderFilters() {
      const c = counts();
      const filters = [
        { id: "all", label: "全部", n: c.all },
        ...STATUSES.map((s) => ({ id: s.id, label: s.label, n: c[s.id] })),
      ];
      const visibleCount = allItems.filter(matchesFilters).length;
      $("filters").innerHTML = filters.map((f) => `
        <button type="button" class="chip" data-filter="${f.id}" aria-pressed="${filterStatus === f.id}">
          ${f.label}<span class="n">${f.n}</span>
        </button>
      `).join("") + `
        <span class="filters-spacer"></span>
        <select id="sortSelect" class="sort-select" title="列表排序（组内生效）">
          ${["group", "todo-first", "recent"].map((m) => `<option value="${m}"${state.sortMode === m ? " selected" : ""}>${{ group: "分组顺序", "todo-first": "未测优先", recent: "最近更新" }[m]}</option>`).join("")}
        </select>
        <button class="chip bulk" type="button" id="bulkPass" ${visibleCount ? "" : "disabled"}>批量通过 · ${visibleCount}</button>
        <button class="chip bulk" type="button" id="bulkReset" ${visibleCount ? "" : "disabled"}>批量清空 · ${visibleCount}</button>
      `;
      $("filters").querySelectorAll("button[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          filterStatus = btn.dataset.filter;
          render();
        });
      });
      $("sortSelect").addEventListener("change", (e) => {
        state.sortMode = e.target.value;
        saveState();
        render();
      });
      $("bulkPass").addEventListener("click", () => bulkApply("pass"));
      $("bulkReset").addEventListener("click", () => bulkApply("reset"));
    }

    function getStatusOf(id) {
      return getItemState(id).status || "todo";
    }

    function sortVisible(items) {
      if (state.sortMode === "group") return items;
      const rank = { todo: 0, pass: 1, fail: 2, skip: 3, blocked: 4 };
      const arr = items.slice();
      if (state.sortMode === "todo-first") {
        arr.sort((a, b) => rank[getStatusOf(a.id)] - rank[getStatusOf(b.id)]);
      } else {
        const t = (id) => {
          const v = Date.parse(getItemState(id).updatedAt || "");
          return Number.isFinite(v) ? v : 0;
        };
        arr.sort((a, b) => t(b.id) - t(a.id));
      }
      return arr;
    }

    function toggleCollapse(groupId) {
      const idx = state.collapsedGroups.indexOf(groupId);
      if (idx === -1) state.collapsedGroups.push(groupId);
      else state.collapsedGroups.splice(idx, 1);
      saveState();
      render();
    }

    function makeRow(item) {
      const st = getItemState(item.id);
      const status = st.status || "todo";
      const doneSteps = Array.isArray(st.stepsChecked) ? st.stepsChecked.length : 0;
      const stepTag = doneSteps && item.steps && item.steps.length && doneSteps < item.steps.length
        ? `<span class="tag ok" title="已确认 ${doneSteps}/${item.steps.length} 步">步骤 ${doneSteps}/${item.steps.length}</span>` : "";
      const row = document.createElement("div");
      row.className = `row${state.selectedId === item.id ? " active" : ""}`;
      row.dataset.id = item.id;
      row.dataset.status = status;
      row.tabIndex = 0;
      row.innerHTML = `
        <span class="check" title="点击切换 通过/未测" aria-hidden="true">${status === "pass" ? "✓" : ""}</span>
        <span class="status ${status}" title="点击循环切换：未测→通过→失败→跳过→阻塞">${STATUSES.find((s) => s.id === status)?.short || status}</span>
        <span class="label" title="${escapeAttr(item.title)}">${escapeHtml(item.title)}</span>
        <span class="tags">${(item.tags || []).map((t) => `<span class="tag ${tagClass(t)}">${escapeHtml(t)}</span>`).join("")}${stepTag}</span>
        <span class="updated">${formatTime(st.updatedAt)}</span>
      `;
      row.addEventListener("click", (e) => {
        if (e.target.closest(".check")) {
          setItemStatus(item.id, status === "pass" ? "todo" : "pass");
          state.selectedId = item.id;
          saveState();
          render();
          return;
        }
        if (e.target.closest(".status")) {
          cycleStatus(item.id);
          return;
        }
        state.selectedId = item.id;
        state.showDetail = true;
        saveState();
        render();
      });
      row.addEventListener("dblclick", () => {
        const cur = getItemState(item.id).status || "todo";
        setItemStatus(item.id, cur === "pass" ? "todo" : "pass");
        render();
      });
      return row;
    }

    function cycleStatus(id) {
      const order = ["todo", "pass", "fail", "skip", "blocked"];
      const next = order[(order.indexOf(getStatusOf(id)) + 1) % order.length];
      setItemStatus(id, next);
      toast(`已标记「${statusLabel(next)}」`);
    }

    function renderList() {
      const list = $("list");
      const visible = allItems.filter(matchesFilters);

      const c = counts();
      const pct = c.all ? Math.round((c.pass / c.all) * 100) : 0;
      $("progressText").textContent = `${c.pass} / ${c.all}`;
      $("progressPct").textContent = `${pct}%`;
      $("progressBar").style.width = `${pct}%`;

      if (visible.length === 0) {
        list.innerHTML = `<div class="empty-list">没有匹配的用例</div>`;
        return;
      }

      const byGroup = new Map();
      for (const item of visible) {
        if (!byGroup.has(item.groupId)) byGroup.set(item.groupId, []);
        byGroup.get(item.groupId).push(item);
      }

      const frag = document.createDocumentFragment();
      for (const g of GROUPS) {
        let items = byGroup.get(g.id);
        if (!items?.length) continue;
        items = sortVisible(items);
        const gc = groupCounts(g.id);
        const collapsed = state.collapsedGroups.includes(g.id);
        const block = document.createElement("div");
        block.className = `group-block${collapsed ? " collapsed" : ""}`;
        const titleBtn = document.createElement("button");
        titleBtn.type = "button";
        titleBtn.title = collapsed ? "展开该分组" : "折叠该分组";
        titleBtn.innerHTML = `<span class="group-chevron">▼</span>${escapeHtml(g.title)}`;
        titleBtn.onclick = () => toggleCollapse(g.id);
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = collapsed ? `${gc.pass}/${gc.total} · ${items.length} 项已折叠` : `${gc.pass}/${gc.total}`;
        const head = document.createElement("div");
        head.className = "group-title";
        head.append(titleBtn, meta);
        block.appendChild(head);
        if (!collapsed) {
          for (const item of items) {
            block.appendChild(makeRow(item));
          }
        }
        frag.appendChild(block);
      }
      list.innerHTML = "";
      list.appendChild(frag);

      const active = list.querySelector(".row.active");
      if (active) active.scrollIntoView({ block: "nearest" });
    }

    function renderDetail() {
      const main = $("main");
      main.classList.toggle("no-detail", !state.showDetail);
      const detail = $("detail");
      if (!state.showDetail) {
        detail.innerHTML = "";
        return;
      }
      const item = state.selectedId ? itemById[state.selectedId] : null;
      if (!item) {
        detail.innerHTML = `<div class="detail-empty">点左侧一条用例<br/>查看步骤与期望结果</div>`;
        return;
      }
      const st = getItemState(item.id);
      const checked = new Set((Array.isArray(st.stepsChecked) ? st.stepsChecked : []).filter((n) => Number.isInteger(n)));
      const totalSteps = (item.steps || []).length;
      const stepsHtml = (item.steps || []).map((s, i) => {
        const on = checked.has(i);
        return `<li class="step-item"><button type="button" class="step-check${on ? " on" : ""}" data-i="${i}" title="标记第 ${i + 1} 步已确认">${on ? "✓" : ""}</button><span>${escapeHtml(s)}</span></li>`;
      }).join("");
      detail.innerHTML = `
        <div class="detail-head">
          <div class="id">${escapeHtml(item.groupTitle)} · ${escapeHtml(item.id)}</div>
          <h2>${escapeHtml(item.title)}</h2>
        </div>
        <div class="detail-body">
          <div class="field">
            <label>测试步骤${totalSteps ? ` · <span class="step-meta">${checked.size}/${totalSteps} 已确认</span>` : ""}</label>
            <ol style="margin:0;padding-left:0;color:var(--ink-2);display:grid;gap:6px;list-style:none">${stepsHtml}</ol>
          </div>
          <div class="field">
            <label>期望结果</label>
            <div style="color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px">${escapeHtml(item.expect || "")}</div>
          </div>
          <div class="field">
            <label>测试状态</label>
            <div class="status-grid" id="statusGrid">
              ${STATUSES.map((s) => `
                <button type="button" data-status="${s.id}" class="${st.status === s.id ? `active ${s.id}` : ""}">${s.label}</button>
              `).join("")}
            </div>
          </div>
          ${(item.tags || []).length ? `<div class="field"><label>标签</label><div class="tags">${item.tags.map((t) => `<span class="tag ${tagClass(t)}">${escapeHtml(t)}</span>`).join("")}</div></div>` : ""}
          <div class="field">
            <label>我的备注</label>
            <textarea class="note" id="noteInput" placeholder="实际结果、截图路径、bug 链接…">${escapeHtml(st.note || "")}</textarea>
          </div>
          <div class="field">
            <label>最近更新</label>
            <div style="font-family:var(--mono);color:var(--ink-3)">${formatTime(st.updatedAt)}</div>
          </div>
        </div>
        <div class="detail-actions">
          <button class="btn" type="button" id="markPass">标为通过</button>
          <button class="btn" type="button" id="markFail">标为失败</button>
          <button class="btn" type="button" id="copyCase">复制用例</button>
          <button class="btn ghost" type="button" id="clearItem">清状态</button>
        </div>
      `;

      detail.querySelectorAll(".step-check").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.dataset.i);
          const cur = new Set((Array.isArray(st.stepsChecked) ? st.stepsChecked : []).filter((n) => Number.isInteger(n)));
          if (cur.has(i)) cur.delete(i); else cur.add(i);
          setItemSteps(item.id, [...cur].sort((a, b) => a - b));
          render();
        });
      });
      detail.querySelectorAll("#statusGrid button").forEach((btn) => {
        btn.addEventListener("click", () => {
          setItemStatus(item.id, btn.dataset.status);
          render();
          toast(`已标记为「${statusLabel(btn.dataset.status)}」`);
        });
      });
      const noteInput = detail.querySelector("#noteInput");
      let noteTimer;
      noteInput.addEventListener("input", () => {
        clearTimeout(noteTimer);
        noteTimer = setTimeout(() => {
          setItemNote(item.id, noteInput.value);
        }, 200);
      });
      $("markPass").onclick = () => { setItemStatus(item.id, "pass"); render(); toast("已通过"); };
      $("markFail").onclick = () => { setItemStatus(item.id, "fail"); render(); toast("已失败"); };
      $("copyCase").onclick = () => copyCaseText(item);
      $("clearItem").onclick = () => {
        state.items[item.id] = { status: "todo", note: "", stepsChecked: [], updatedAt: new Date().toISOString() };
        saveState();
        render();
      };
    }

    function render() {
      renderSidebar();
      renderFilters();
      renderList();
      renderDetail();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }
    function escapeAttr(s) { return escapeHtml(s); }

    $("search").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      render();
    });

    $("toggleDetail").addEventListener("click", () => {
      state.showDetail = !state.showDetail;
      saveState();
      render();
    });

    $("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({
        exportedAt: new Date().toISOString(),
        storageKey: STORAGE_KEY,
        state,
        summary: counts(),
      }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `piwin-test-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast("已导出进度");
    });

    $("importBtn").addEventListener("click", () => $("importFile").click());
    $("importFile").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      e.target.value = "";
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        const incoming = data.state || data;
        const ok = await confirmAction("导入进度", "导入会覆盖当前本机状态与备注，导入前会自动备份当前进度。");
        if (!ok) return;
        backupNow("导入前自动备份");
        state = normalizeState(incoming);
        saveState();
        render();
        toast("导入完成");
      } catch {
        alert("导入失败：JSON 无效");
      }
    });

    $("resetBtn").addEventListener("click", async () => {
      const ok = await confirmAction("重置全部", "清空所有测试状态与备注，不可恢复（会先自动备份当前进度）。");
      if (!ok) return;
      backupNow("重置前自动备份");
      state.items = {};
      state.selectedId = null;
      saveState();
      render();
      toast("已重置");
    });

    $("reportBtn").addEventListener("click", exportReport);
    $("restoreBtn").addEventListener("click", restoreBackup);
    $("helpClose").addEventListener("click", () => $("helpDialog").close());
    $("progressPill").addEventListener("click", () => {
      filterStatus = filterStatus === "todo" ? "all" : "todo";
      render();
    });

    function activateGroup(id) {
      state.activeGroup = id;
      const i = state.collapsedGroups.indexOf(id);
      if (i !== -1) state.collapsedGroups.splice(i, 1);
      saveState();
      render();
    }

    function backupNow(reason) {
      try {
        localStorage.setItem(BACKUP_KEY, JSON.stringify({ at: new Date().toISOString(), reason, state }));
      } catch {
        toast("自动备份失败：浏览器存储空间不足");
      }
    }

    function restoreBackup() {
      const raw = localStorage.getItem(BACKUP_KEY);
      if (!raw) {
        toast("暂无自动备份");
        return;
      }
      let bak;
      try {
        bak = JSON.parse(raw);
      } catch {
        toast("备份已损坏，无法恢复");
        return;
      }
      confirmAction("恢复备份", `将覆盖当前进度，恢复为 ${formatTime(bak.at)} 的自动备份（原因：${bak.reason || "手动"}）。`).then((ok) => {
        if (!ok) return;
        state = normalizeState(bak.state || {});
        saveState();
        render();
        toast("已恢复备份");
      });
    }

    function bulkApply(mode) {
      const targets = allItems.filter(matchesFilters);
      if (!targets.length) {
        toast("当前筛选下没有用例");
        return;
      }
      const verb = mode === "reset" ? "清空状态与备注" : "标记为「通过」";
      confirmAction(`批量${mode === "reset" ? "清空" : "通过"}`, `将对当前筛选下的 ${targets.length} 条用例${verb}。${mode === "reset" ? "现有标记会先自动备份。" : "建议先筛选出范围再执行。"}`).then((ok) => {
        if (!ok) return;
        if (mode === "reset") backupNow("批量清空前自动备份");
        const now = new Date().toISOString();
        for (const item of targets) {
          state.items[item.id] = mode === "reset"
            ? { status: "todo", note: "", stepsChecked: [], updatedAt: now }
            : { ...getItemState(item.id), status: "pass", updatedAt: now };
        }
        saveState();
        render();
        toast(`已${mode === "reset" ? "清空" : "标记通过"} ${targets.length} 条`);
      });
    }

    async function copyCaseText(item) {
      const st = getItemState(item.id);
      const lines = [
        `【${statusLabel(st.status)}】${item.title}（${item.id}）`,
        `分组：${item.groupTitle}`,
        `步骤：`,
        ...(item.steps || []).map((s, i) => `${i + 1}. ${s}`),
        `期望：${item.expect || ""}`,
      ];
      if (st.note) lines.push(`备注：${st.note}`);
      try {
        await navigator.clipboard.writeText(lines.join("\n"));
        toast("用例已复制到剪贴板");
      } catch {
        toast("复制失败：浏览器未授权剪贴板");
      }
    }

    function exportReport() {
      const c = counts();
      const lines = [
        "# piwin 桌面端功能测试报告",
        "",
        `- 生成时间：${new Date().toLocaleString("zh-CN")}`,
        `- 汇总：通过 ${c.pass} · 失败 ${c.fail} · 跳过 ${c.skip} · 阻塞 ${c.blocked} · 未测 ${c.todo}（共 ${c.all}）`,
        "",
      ];
      for (const g of GROUPS) {
        lines.push(`## ${g.title}`, "", "| 状态 | 用例 | 备注 | 最近更新 |", "| --- | --- | --- | --- |");
        for (const item of g.items) {
          const st = getItemState(item.id);
          const note = (st.note || "").replace(/\|/g, "\\|").replace(/\n+/g, "<br>");
          lines.push(`| ${statusLabel(st.status)} | **[${item.id}]** ${item.title.replace(/\|/g, "\\|")} | ${note || ""} | ${formatTime(st.updatedAt)} |`);
        }
        lines.push("");
      }
      const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `piwin-test-report-${new Date().toISOString().slice(0, 10)}.md`;
      a.click();
      URL.revokeObjectURL(url);
      toast("报告已导出");
    }

    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) || "";
      const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      const onButton = tag === "BUTTON";

      if (e.key === "/" && !typing) {
        e.preventDefault();
        $("search").focus();
        $("search").select();
        return;
      }
      if (e.key === "Escape") {
        if (document.activeElement === $("search")) {
          $("search").blur();
          searchQuery = "";
          $("search").value = "";
          render();
        }
        return;
      }
      if (e.key === "?") {
        $("helpDialog").showModal();
        return;
      }
      if (typing) return;
      if ((e.key === " " || e.key === "Enter") && onButton) return;

      const groupIds = ["all", ...GROUPS.map((g) => g.id)];
      if (e.key === "[") {
        e.preventDefault();
        const gi = Math.max(0, groupIds.indexOf(state.activeGroup) - 1);
        activateGroup(groupIds[gi]);
        return;
      }
      if (e.key === "]") {
        e.preventDefault();
        const cur = groupIds.indexOf(state.activeGroup);
        const gi = Math.min(groupIds.length - 1, (cur === -1 ? 0 : cur) + 1);
        activateGroup(groupIds[gi]);
        return;
      }

      const visible = [...document.querySelectorAll(".row")];
      if (!visible.length) return;
      let idx = visible.findIndex((r) => r.dataset.id === state.selectedId);

      if (e.key === "j" || e.key === "ArrowDown") {
        e.preventDefault();
        idx = Math.min(visible.length - 1, Math.max(0, idx) + (idx === -1 ? 0 : 1));
        if (idx === -1) idx = 0;
        state.selectedId = visible[idx].dataset.id;
        state.showDetail = true;
        saveState();
        render();
      } else if (e.key === "k" || e.key === "ArrowUp") {
        e.preventDefault();
        idx = Math.max(0, (idx === -1 ? 0 : idx) - 1);
        state.selectedId = visible[idx].dataset.id;
        state.showDetail = true;
        saveState();
        render();
      } else if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        if (!state.selectedId) return;
        const cur = getItemState(state.selectedId).status || "todo";
        setItemStatus(state.selectedId, cur === "pass" ? "todo" : "pass");
        render();
      } else if (e.key === "1") { if (state.selectedId) { setItemStatus(state.selectedId, "todo"); render(); } }
      else if (e.key === "2") { if (state.selectedId) { setItemStatus(state.selectedId, "pass"); render(); } }
      else if (e.key === "3") { if (state.selectedId) { setItemStatus(state.selectedId, "fail"); render(); } }
      else if (e.key === "4") { if (state.selectedId) { setItemStatus(state.selectedId, "skip"); render(); } }
      else if (e.key === "5") { if (state.selectedId) { setItemStatus(state.selectedId, "blocked"); render(); } }
    });

    render();
  </script>
</body>
</html>
