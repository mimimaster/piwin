<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #6eb6d9;
      --sky-mid: #c8e7f4;
      --sky-horizon: #ffe4c4;
      --sun: #ffd56a;
      --sea-deep: #2a7d8c;
      --sea: #3d9aad;
      --hill-far: #6fa37a;
      --hill-near: #4e8a62;
      --sand: #edd4a4;
      --road: #6a6460;
      --road-line: #f3e2ae;
      --body: #f6f0e3;
      --body-shade: #e2d4bc;
      --wing: #c9bba6;
      --wing-tip: #5a5248;
      --beak: #ef8a38;
      --beak-deep: #d15f1c;
      --pouch: #f3b06b;
      --frame: #2a9d8f;
      --frame-dark: #1d7a70;
      --accent: #e76f51;
      --tire: #2b2927;
      --rim: #efe6d6;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #1a2430;
      color: #f4efe6;
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 20px 36px;
      background:
        radial-gradient(1200px 500px at 50% -10%, #2b3d52 0%, transparent 60%),
        #1a2430;
    }

    .caption {
      width: min(960px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 14px;
    }

    .caption h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.4vw, 1.8rem);
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .caption p {
      margin: 0;
      color: #b7c0c8;
      font-size: 0.92rem;
    }

    .stage {
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 24px 60px rgba(0, 0, 0, 0.38);
      background: #7ec8e3;
    }

    .stage svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cloud-a { animation: drift 42s linear infinite; }
    .cloud-b { animation: drift 58s linear infinite; }
    .cloud-c { animation: drift 36s linear infinite; }
    .gulls { animation: drift 28s linear infinite; }
    .hills-far { animation: drift-slow 80s linear infinite; }
    .hills-near { animation: drift-mid 48s linear infinite; }
    .sea-shine { animation: shimmer 6s ease-in-out infinite; }
    .wave { animation: wave 3.2s ease-in-out infinite; }
    .wave-2 { animation: wave 4.1s ease-in-out infinite reverse; }
    .road-marks { animation: scroll 0.7s linear infinite; }
    .dunes { animation: scroll 1.4s linear infinite; }
    .grass { animation: scroll 0.95s linear infinite; }
    .dust { animation: puff 0.55s ease-out infinite; }

    .rider {
      animation: bob 0.55s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 80%;
    }
    .shadow { animation: squash 0.55s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .head { animation: nod 0.55s ease-in-out infinite; transform-box: fill-box; transform-origin: 12% 70%; }
    .pouch { animation: jiggle 0.55s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 0%; }
    .wing { animation: flap 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 30%; }
    .tail { animation: wag 0.7s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 40%; }
    .bell-spark { animation: ding 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-480px); }
    }
    @keyframes drift-slow {
      from { transform: translateX(0); }
      to { transform: translateX(-360px); }
    }
    @keyframes drift-mid {
      from { transform: translateX(0); }
      to { transform: translateX(-420px); }
    }
    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-80px); }
    }
    @keyframes bob {
      0%, 100% { transform: translate(0, 0) rotate(-1.2deg); }
      50% { transform: translate(2px, -5px) rotate(1.1deg); }
    }
    @keyframes squash {
      0%, 100% { transform: scale(1, 1); opacity: 0.28; }
      50% { transform: scale(0.92, 0.82); opacity: 0.2; }
    }
    @keyframes nod {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes jiggle {
      0%, 100% { transform: rotate(-3deg) scaleY(1); }
      50% { transform: rotate(4deg) scaleY(1.06); }
    }
    @keyframes flap {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-14deg); }
    }
    @keyframes wag {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes wave {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-18px); }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.42; }
    }
    @keyframes puff {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0.35; }
      100% { transform: translate(-28px, -10px) scale(1.15); opacity: 0; }
    }
    @keyframes ding {
      0%, 78%, 100% { opacity: 0; transform: scale(0.4); }
      84%, 90% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud-a, .cloud-b, .cloud-c, .gulls, .hills-far, .hills-near,
      .sea-shine, .wave, .wave-2, .road-marks, .dunes, .grass, .dust,
      .rider, .shadow, .head, .pouch, .wing, .tail, .bell-spark {
        animation: none;
      }
    }
  </style>
</head>
