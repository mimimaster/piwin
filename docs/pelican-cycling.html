<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --ink: #1c1917;
      --cycle: 0.9s;
      --wheel: 0.55s;
      --scroll-near: 2.4s;
      --scroll-mid: 8s;
      --scroll-far: 28s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0e2a36;
      color: #f6efe0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #7ec8e3;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    .stage svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: absolute;
      left: 3.2%;
      bottom: 4.2%;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(14, 42, 54, 0.35);
    }

    .caption h1 {
      font-size: clamp(18px, 2.4vw, 32px);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.2;
    }

    .caption p {
      margin-top: 0.25em;
      font-size: clamp(11px, 1.2vw, 15px);
      opacity: 0.85;
      letter-spacing: 0.18em;
    }

    .hint {
      position: absolute;
      right: 3.2%;
      bottom: 4.2%;
      font-size: clamp(10px, 1.1vw, 13px);
      letter-spacing: 0.12em;
      opacity: 0.7;
      pointer-events: none;
    }

    /* scrolling layers: origin must be the SVG viewBox, not each group's bbox */
    .cloud-a, .wave-a, .wave-b,
    .scroll-far, .scroll-mid, .scroll-near, .scroll-ground {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .cloud-a { animation: drift var(--scroll-far) linear infinite; }
    .wave-a { animation: wave-shift 6s linear infinite; }
    .wave-b { animation: wave-shift 4.2s linear infinite reverse; }
    .scroll-far { animation: tile-far var(--scroll-far) linear infinite; }
    .scroll-mid { animation: tile-mid var(--scroll-mid) linear infinite; }
    .scroll-near { animation: tile-near var(--scroll-near) linear infinite; }
    .scroll-ground { animation: tile-ground var(--scroll-near) linear infinite; }

    .gull, .gull-2 {
      transform-box: fill-box;
      transform-origin: 50% 50%;
    }
    .gull { animation: gull-bob 2.8s ease-in-out infinite; }
    .gull-2 { animation: gull-bob 3.4s ease-in-out infinite 0.6s; }

    .vehicle {
      transform-box: view-box;
      transform-origin: 645px 575px;
      animation: wobble calc(var(--cycle) * 2) ease-in-out infinite;
    }

    .bob {
      transform-box: view-box;
      transform-origin: 645px 505px;
      animation: bob var(--cycle) ease-in-out infinite;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 12% 45%;
      animation: flap calc(var(--cycle) * 1.15) ease-in-out infinite;
    }

    .head-group {
      transform-box: fill-box;
      transform-origin: 28% 78%;
      animation: nod calc(var(--cycle) * 2) ease-in-out infinite;
    }

    .pouch {
      transform-box: fill-box;
      transform-origin: 18% 8%;
      animation: pouch var(--cycle) ease-in-out infinite;
    }

    .fish {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: fish-wiggle 0.7s ease-in-out infinite;
    }

    .blink {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: blink 4.6s ease-in-out infinite;
    }

    .dust {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: dust 0.9s ease-out infinite;
    }

    .grass-blade {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: sway 2.2s ease-in-out infinite;
    }

    .shadow {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: shadow-pulse var(--cycle) ease-in-out infinite;
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-720px); }
    }

    @keyframes wave-shift {
      from { transform: translateX(0); }
      to { transform: translateX(-160px); }
    }

    @keyframes tile-far {
      from { transform: translateX(0); }
      to { transform: translateX(-640px); }
    }

    @keyframes tile-mid {
      from { transform: translateX(0); }
      to { transform: translateX(-480px); }
    }

    @keyframes tile-near {
      from { transform: translateX(0); }
      to { transform: translateX(-360px); }
    }

    @keyframes tile-ground {
      from { transform: translateX(0); }
      to { transform: translateX(-240px); }
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-1.4deg); }
      50% { transform: rotate(1.1deg); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes flap {
      0%, 100% { transform: rotate(6deg); }
      50% { transform: rotate(-14deg); }
    }

    @keyframes nod {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-4deg); }
    }

    @keyframes pouch {
      0%, 100% { transform: scale(1, 1) rotate(0deg); }
      50% { transform: scale(1.05, 0.93) rotate(1.6deg); }
    }

    @keyframes fish-wiggle {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      50% { transform: translate(3px, -4px) rotate(10deg); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }

    @keyframes dust {
      0% { opacity: 0.5; transform: translate(0, 0) scale(0.55); }
      100% { opacity: 0; transform: translate(-52px, -12px) scale(1.35); }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes gull-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes shadow-pulse {
      0%, 100% { transform: scaleX(1); opacity: 0.22; }
      50% { transform: scaleX(0.92); opacity: 0.16; }
    }

    @keyframes chain {
      to { stroke-dashoffset: -28; }
    }

    .chain {
      stroke-dasharray: 5 6;
      animation: chain 0.45s linear infinite;
    }

    body.paused .stage * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .stage * { animation: none !important; }
    }
  </style>
</head>

  <script>
    const stage = document.getElementById("stage");
    const svg = stage.querySelector("svg");
    const hint = document.getElementById("hint");
    stage.addEventListener("click", () => {
      document.body.classList.toggle("paused");
      const paused = document.body.classList.contains("paused");
      if (paused) svg.pauseAnimations();
      else svg.unpauseAnimations();
      hint.textContent = paused ? "点击画面继续" : "点击画面暂停";
    });
  </script>
