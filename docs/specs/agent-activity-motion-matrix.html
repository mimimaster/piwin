<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>piwin Agent 调用链动效矩阵</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111214;
        --panel: #181a1e;
        --panel-strong: #1e2025;
        --line: rgba(255, 255, 255, 0.1);
        --line-soft: rgba(255, 255, 255, 0.06);
        --text: #e7e9ed;
        --muted: #a1a6b0;
        --faint: #737985;
        --blue: #78a9ff;
        --cyan: #62d9dc;
        --green: #65d49a;
        --yellow: #f4bd67;
        --red: #ff7878;
        --purple: #c69cff;
        --bloom: 3s;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 1120px;
        margin: 0;
        padding: 34px;
        background:
          radial-gradient(circle at 12% 0%, rgba(95, 135, 255, 0.12), transparent 34rem), var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
      }

      main {
        max-width: 1680px;
        margin: 0 auto;
      }

      .eyebrow {
        color: var(--blue);
        font:
          600 11px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 9px 0 8px;
        font-size: clamp(25px, 3vw, 38px);
        letter-spacing: -0.04em;
      }

      .intro {
        max-width: 820px;
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      .legend span,
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        padding: 3px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
      }

      .legend .running {
        color: var(--blue);
        border-color: rgba(120, 169, 255, 0.3);
      }
      .legend .done {
        color: var(--green);
        border-color: rgba(101, 212, 154, 0.3);
      }
      .legend .error {
        color: var(--red);
        border-color: rgba(255, 120, 120, 0.3);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 28px 0 12px;
        color: var(--muted);
      }

      button {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 11px;
        background: var(--panel-strong);
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        border-color: rgba(120, 169, 255, 0.55);
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }
      input {
        accent-color: var(--blue);
      }
      #row-count {
        margin-left: auto;
        color: var(--faint);
        font:
          12px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }

      .table-shell {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(24, 26, 30, 0.86);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(30, 32, 37, 0.96);
        color: var(--faint);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line-soft);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tbody tr {
        transition: background 140ms ease;
      }
      tbody tr:hover {
        background: rgba(120, 169, 255, 0.055);
      }
      tbody tr.is-hidden {
        display: none;
      }

      .group-cell {
        width: 128px;
        color: var(--faint);
        font-size: 12px;
      }
      .unit-cell {
        width: 150px;
      }
      .unit-cell code,
      .motion-name,
      .copy-en {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .unit-cell code {
        color: var(--cyan);
        font-size: 12px;
      }
      .behavior-name {
        margin-top: 5px;
        color: var(--text);
        font-weight: 550;
      }
      .copy-zh {
        color: var(--text);
        line-height: 1.4;
      }
      .copy-en {
        margin-top: 4px;
        color: var(--faint);
        font-size: 11px;
        line-height: 1.4;
      }
      .surface {
        color: var(--muted);
        white-space: nowrap;
      }
      .surface code {
        color: var(--purple);
        font-size: 11px;
      }
      .effect {
        min-width: 230px;
      }
      .motion-name {
        margin-top: 7px;
        color: var(--muted);
        font-size: 11px;
      }
      .terminal {
        color: var(--muted);
        line-height: 1.45;
      }
      .terminal.error-copy {
        color: var(--red);
      }

      .status.done {
        color: var(--green);
        border-color: rgba(101, 212, 154, 0.26);
      }
      .status.error {
        color: var(--red);
        border-color: rgba(255, 120, 120, 0.26);
      }
      .status.neutral {
        color: var(--faint);
      }

      /* The animation preview cells below deliberately mirror the product
       * behavior names, but remain standalone so this file opens directly. */
      .motion-demo {
        display: inline-flex;
        position: relative;
        width: 68px;
        height: 34px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.025);
        color: var(--blue);
        vertical-align: middle;
      }

      .motion-radial {
        position: relative;
        width: 27px;
        height: 27px;
      }
      .motion-radial i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 13px;
        margin: -6.5px 0 0 -2px;
        border-radius: 999px;
        background: currentColor;
        transform: rotate(var(--angle)) translateY(-8px);
        transform-origin: 50% 50%;
        animation: radial 2.8s ease-in-out infinite;
      }

      .motion-asterisk {
        position: relative;
        width: 26px;
        height: 26px;
      }
      .motion-asterisk i {
        position: absolute;
        left: 11px;
        top: 2px;
        width: 4px;
        height: 22px;
        border-radius: 999px;
        background: currentColor;
        transform: rotate(var(--angle));
        transform-origin: 50% 50%;
        animation: asterisk 2.8s ease-in-out infinite;
      }
      .motion-asterisk b {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: currentColor;
        animation: dot 2.8s ease-in-out infinite;
      }

      .motion-dot i {
        display: block;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: currentColor;
        animation: dot 2s ease-in-out infinite;
      }

      .motion-grid {
        display: grid;
        grid-template-columns: repeat(3, 6px);
        gap: 3px;
      }
      .motion-grid i {
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: currentColor;
        animation: cell 2.2s ease-in-out infinite;
        animation-delay: var(--delay);
      }

      .motion-bars {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 22px;
      }
      .motion-bars i {
        width: 4px;
        height: 17px;
        border-radius: 3px;
        background: currentColor;
        animation: bar 1.5s ease-in-out infinite;
        animation-delay: var(--delay);
      }

      .motion-cascade {
        display: flex;
        align-items: center;
        gap: 3px;
        width: 38px;
      }
      .motion-cascade i {
        display: block;
        flex: 1;
        height: 4px;
        border-radius: 3px;
        background: currentColor;
        animation: cascade 1.7s ease-in-out infinite;
        animation-delay: var(--delay);
      }

      .motion-text {
        color: transparent;
        background: linear-gradient(
          135deg,
          #5d6066 15%,
          #858990 34%,
          #e2e4e8 50%,
          #858990 66%,
          #5d6066 85%
        );
        background-size: 280% 280%;
        background-position: 130% 130%;
        -webkit-background-clip: text;
        background-clip: text;
        font-size: 12px;
        animation: text-bloom var(--bloom) ease-in-out infinite;
      }

      .motion-diff {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--green);
        font:
          600 17px ui-monospace,
          monospace;
        animation: diff 1.8s ease-in-out infinite;
      }
      .motion-diff i {
        display: block;
        width: 12px;
        height: 17px;
        border-left: 2px solid currentColor;
        border-right: 2px solid currentColor;
        opacity: 0.6;
      }
      .motion-artifact {
        position: relative;
        width: 34px;
        height: 22px;
        overflow: hidden;
        border: 1px solid var(--purple);
        border-radius: 4px;
      }
      .motion-artifact::before {
        position: absolute;
        inset: -40%;
        content: '';
        background: linear-gradient(
          115deg,
          transparent 35%,
          rgba(255, 255, 255, 0.8) 50%,
          transparent 65%
        );
        animation: sheen 1.8s linear infinite;
      }
      .motion-artifact b {
        position: absolute;
        inset: 5px;
        border: 1px solid currentColor;
        border-radius: 2px;
        opacity: 0.7;
      }
      .motion-gate {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border: 2px solid currentColor;
        border-radius: 50%;
        color: var(--yellow);
        font-weight: 700;
        animation: gate 1.8s ease-in-out infinite;
      }
      .motion-none {
        color: var(--faint);
        font-size: 20px;
      }

      @keyframes radial {
        0%,
        100% {
          opacity: 0.42;
          transform: rotate(var(--angle)) translateY(-8px) scaleY(0.78);
        }
        50% {
          opacity: 1;
          transform: rotate(var(--angle)) translateY(-8px) scaleY(1.15);
        }
      }
      @keyframes asterisk {
        0%,
        100% {
          opacity: 0.45;
          transform: rotate(var(--angle)) scale(0.82);
        }
        50% {
          opacity: 1;
          transform: rotate(var(--angle)) scale(1.08);
        }
      }
      @keyframes dot {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.82);
        }
        50% {
          opacity: 1;
          transform: scale(1.18);
        }
      }
      @keyframes cell {
        0%,
        100% {
          opacity: 0.22;
          transform: scale(0.7);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes bar {
        0%,
        100% {
          opacity: 0.4;
          transform: scaleY(0.55);
        }
        50% {
          opacity: 1;
          transform: scaleY(1);
        }
      }
      @keyframes cascade {
        0%,
        100% {
          opacity: 0.35;
          transform: translateX(-2px);
        }
        50% {
          opacity: 1;
          transform: translateX(2px);
        }
      }
      @keyframes text-bloom {
        0%,
        12% {
          background-position: 130% 130%;
        }
        88%,
        100% {
          background-position: -130% -130%;
        }
      }
      @keyframes diff {
        0%,
        100% {
          opacity: 0.55;
          transform: translateY(1px);
        }
        50% {
          opacity: 1;
          transform: translateY(-1px);
        }
      }
      @keyframes sheen {
        from {
          transform: translateX(-38%);
        }
        to {
          transform: translateX(38%);
        }
      }
      @keyframes gate {
        0%,
        100% {
          opacity: 0.58;
          box-shadow: 0 0 0 0 rgba(244, 189, 103, 0);
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 0 5px rgba(244, 189, 103, 0.12);
        }
      }

      html.motion-paused *,
      html.motion-paused *::before,
      html.motion-paused *::after {
        animation-play-state: paused !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @media (max-width: 1180px) {
        body {
          min-width: 0;
          padding: 18px;
        }
        .table-shell {
          border-radius: 8px;
        }
      }
    </style>
  </head>

      const $ = (selector) => document.querySelector(selector);

      function cells(count, className, delayStep) {
        return Array.from(
          { length: count },
          (_, index) => `<i style="--delay:${index * delayStep}s"></i>`,
        ).join('');
      }

      function radial() {
        return `<span class="motion-radial">${Array.from({ length: 6 }, (_, index) => `<i style="--angle:${index * 60}deg"></i>`).join('')}</span>`;
      }

      function asterisk() {
        return `<span class="motion-asterisk"><i style="--angle:0deg"></i><i style="--angle:60deg"></i><i style="--angle:120deg"></i><b></b></span>`;
      }

      function motionMarkup(name) {
        switch (name) {
          case 'radial-bellow':
            return radial();
          case 'asterisk-breath':
            return asterisk();
          case 'breath-dot':
            return '<span class="motion-dot"><i></i></span>';
          case 'pulse-block':
            return `<span class="motion-grid">${cells(9, 'motion-grid', 0.12)}</span>`;
          case 'solid-bars':
            return `<span class="motion-bars">${cells(5, 'motion-bars', 0.12)}</span>`;
          case 'breath-matrix':
            return `<span class="motion-grid">${cells(9, 'motion-grid', 0.18)}</span>`;
          case 'cascade-ripple':
            return `<span class="motion-cascade">${cells(5, 'motion-cascade', 0.12)}</span>`;
          case 'text-shimmer':
            return '<span class="motion-text">Working…</span>';
          case 'diff-in':
            return '<span class="motion-diff"><i></i><b>+</b></span>';
          case 'artifact-sheen':
            return '<span class="motion-artifact"><b></b></span>';
          case 'gate-pulse':
            return '<span class="motion-gate">!</span>';
          default:
            return '<span class="motion-none">—</span>';
        }
      }

      function renderRows() {
        const body = $('#matrix-body');
        body.innerHTML = rows
          .map((row) => {
            const [group, id, zh, en, surface, animation, effect, done, error] = row;
            const animated = animation !== 'none';
            return `<tr data-animated="${animated}">
            <td class="group-cell">${group}</td>
            <td class="unit-cell"><code>${id}</code><div class="behavior-name">${id === 'tool.other' ? '未知工具兜底' : '行为单元'}</div></td>
            <td><div class="copy-zh">${zh}</div><div class="copy-en">${en}</div></td>
            <td class="surface"><code>${surface}</code></td>
            <td class="effect"><span class="motion-demo" aria-label="${effect}">${motionMarkup(animation)}</span><div class="motion-name">${animation}</div></td>
            <td><span class="status ${done === '—' ? 'neutral' : 'done'}">${done}</span></td>
            <td><span class="terminal ${error.includes('红色') || error.includes('失败') || error.includes('拒绝') || error.includes('取消') || error.includes('阻止') ? 'error-copy' : ''}">${error}</span></td>
          </tr>`;
          })
          .join('');
        updateCount();
      }

      function updateCount() {
        const visible = [...document.querySelectorAll('#matrix-body tr')].filter(
          (row) => !row.classList.contains('is-hidden'),
        ).length;
        $('#row-count').textContent = `${visible} / ${rows.length} 个调用链单元`;
      }

      $('#toggle-motion').addEventListener('click', (event) => {
        const paused = document.documentElement.classList.toggle('motion-paused');
        event.currentTarget.textContent = paused ? '继续动效' : '暂停动效';
      });

      $('#only-animated').addEventListener('change', (event) => {
        const onlyAnimated = event.currentTarget.checked;
        document.querySelectorAll('#matrix-body tr').forEach((row) => {
          row.classList.toggle('is-hidden', onlyAnimated && row.dataset.animated !== 'true');
        });
        updateCount();
      });

      renderRows();
    </script>
