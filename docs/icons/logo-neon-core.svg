<?xml version="1.0" encoding="UTF-8"?>
<svg width="112" height="112" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="bg-neon-1" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#1e1b18"/>
                    <stop offset="50%" stop-color="#12100e"/>
                    <stop offset="100%" stop-color="#080706"/>
                  </linearGradient>
                  <linearGradient id="pi-glow-1" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="40%" stop-color="#f59e0b"/>
                    <stop offset="100%" stop-color="#d97706"/>
                  </linearGradient>
                  <filter id="glow-filter-1" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                  </filter>
                </defs>
                <!-- Squircle Background Base -->
                <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-neon-1)"/>
                <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" stroke="url(#pi-glow-1)" stroke-opacity="0.35" stroke-width="1"/>
                <!-- Outer Tech Orbit -->
                <circle cx="64" cy="64" r="46" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 4"/>
                <!-- Terminal Angle Bracket + Pi Fusion -->
                <path d="M38 46H90" stroke="url(#pi-glow-1)" stroke-width="9" stroke-linecap="round" filter="url(#glow-filter-1)"/>
                <path d="M50 46V84C50 86.5 48 88.5 45.5 88.5" stroke="url(#pi-glow-1)" stroke-width="9" stroke-linecap="round"/>
                <path d="M74 46V82C74 85.5 76.5 88.5 80 88.5" stroke="url(#pi-glow-1)" stroke-width="9" stroke-linecap="round"/>
                <!-- Glowing Energy Dot (Win/Signal) -->
                <circle cx="86" cy="85" r="5" fill="#06b6d4" filter="url(#glow-filter-1)"/>
                <circle cx="86" cy="85" r="2.5" fill="#ffffff"/>
              </svg>
