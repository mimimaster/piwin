  panelR: <><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="15" y1="3" x2="15" y2="21" /></>,
  panelL: <><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="9" y1="3" x2="9" y2="21" /></>,

/* === Sub Components === */
const ThinkingBlock = () => {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ margin: "10px 0", borderRadius: T.radiusSm, border: `1px solid ${T.lineSoft}`, overflow: "hidden" }}>
      <div onClick={() => setOpen(!open)} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", cursor: "pointer", background: "rgba(143,191,176,0.06)" }}>
        <I d={ic.brain} size={13} color={T.sage} />
        <span style={{ fontSize: 12, color: T.sage, fontWeight: 600 }}>Thinking</span>
        <span style={{ fontSize: 11, color: T.faint, flex: 1 }}>读取 3 个文件 · 规划 2 步修改 · 4.2s</span>
        <I d={open ? ic.chevD : ic.chevR} size={12} color={T.faint} />
      </div>
      {open && (
        <div style={{ padding: "10px 14px", fontSize: 12, lineHeight: 1.75, color: T.muted, borderTop: `1px solid ${T.lineSoft}`, background: "rgba(143,191,176,0.03)", fontFamily: T.mono }}>
          <div style={{ marginBottom: 4, opacity: 0.8 }}>1. 分析 src/auth/ 架构 → JWT + Session 混合模式</div>
          <div style={{ marginBottom: 4, opacity: 0.8 }}>2. 决定在 middleware 层添加 OAuth2 provider 抽象</div>
          <div style={{ marginBottom: 4, opacity: 0.7 }}>3. 需修改: auth.service.ts, middleware/auth.ts</div>
          <div style={{ opacity: 0.5 }}>4. 新增: providers/oauth2.ts, strategies/google.ts, strategies/github.ts</div>
        </div>
      )}
    </div>
  );
};

const DiffCard = ({ fileName, adds, dels, isNew }) => {
  const [state, setState] = useState(null);
  return (
    <div style={{ margin: "10px 0", borderRadius: T.radiusSm, border: `1px solid ${T.lineSoft}`, overflow: "hidden", fontFamily: T.mono, fontSize: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", background: T.surfaceRaised, borderBottom: `1px solid ${T.lineSoft}` }}>
        <I d={ic.file} size={12} color={isNew ? T.ok : T.accent} />
        <span style={{ color: T.text, fontWeight: 500, fontFamily: T.mono, fontSize: 11.5 }}>{fileName}</span>
        {isNew && <span style={{ fontSize: 9, color: T.ok, padding: "1px 5px", borderRadius: 4, background: T.okSoft }}>new</span>}
        <span style={{ color: T.ok, fontSize: 11 }}>+{adds}</span>
        <span style={{ color: T.danger, fontSize: 11 }}>-{dels}</span>
        <div style={{ flex: 1 }} />
        {state === null ? (
          <div style={{ display: "flex", gap: 5 }}>
            <button onClick={() => setState("ok")} style={{ display: "flex", alignItems: "center", gap: 3, padding: "3px 9px", borderRadius: 6, border: `1px solid rgba(121,196,163,0.3)`, background: T.okSoft, color: T.ok, fontSize: 10.5, cursor: "pointer", fontWeight: 500 }}>
              <I d={ic.check} size={10} color={T.ok} /> Accept
            </button>
            <button onClick={() => setState("no")} style={{ display: "flex", alignItems: "center", gap: 3, padding: "3px 9px", borderRadius: 6, border: `1px solid rgba(224,122,106,0.3)`, background: T.dangerSoft, color: T.danger, fontSize: 10.5, cursor: "pointer", fontWeight: 500 }}>
              <I d={ic.x} size={10} color={T.danger} /> Reject
            </button>
          </div>
        ) : (
          <span style={{ fontSize: 10.5, color: state === "ok" ? T.ok : T.danger, fontWeight: 600 }}>
            {state === "ok" ? "✓ Accepted" : "✗ Rejected"}
          </span>
        )}
      </div>
      <div style={{ padding: "6px 0", background: T.canvas, lineHeight: 1.7 }}>
        <div style={{ padding: "1px 12px", color: T.faint }}><span style={{ display: "inline-block", width: 22, userSelect: "none" }}>14</span> import {'{'} JWTService {'}'} from './jwt';</div>
        <div style={{ padding: "1px 12px", background: T.okSoft, color: T.ok }}><span style={{ display: "inline-block", width: 22, userSelect: "none" }}>15</span> +import {'{'} OAuth2Provider {'}'} from './providers/oauth2';</div>
        <div style={{ padding: "1px 12px", background: T.okSoft, color: T.ok }}><span style={{ display: "inline-block", width: 22, userSelect: "none" }}>16</span> +import {'{'} GoogleStrategy, GitHubStrategy {'}'} from './strategies';</div>
        <div style={{ padding: "1px 12px", color: T.faint }}><span style={{ display: "inline-block", width: 22, userSelect: "none" }}>17</span></div>
        <div style={{ padding: "1px 12px", color: T.danger, background: T.dangerSoft, opacity: 0.85 }}><span style={{ display: "inline-block", width: 22, userSelect: "none" }}>18</span> -const auth = new JWTService(config.secret);</div>
        <div style={{ padding: "1px 12px", background: T.okSoft, color: T.ok }}><span style={{ display: "inline-block", width: 22, userSelect: "none" }}>18</span> +const auth = new OAuth2Provider({'{'} strategies: [google, github] {'}'});</div>
      </div>
    </div>
  );
};

const ToolCallCard = ({ name, status, detail }) => (
  <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 11px", margin: "4px 0", borderRadius: 8, border: `1px solid ${T.lineSoft}`, background: T.panel, fontSize: 11.5 }}>
    <div style={{ width: 18, height: 18, borderRadius: 5, display: "grid", placeItems: "center", background: status === "done" ? T.okSoft : T.accentSoft }}>
      {status === "done" ? <I d={ic.check} size={10} color={T.ok} /> : <div style={{ width: 10, height: 10, border: `1.5px solid ${T.accent}`, borderTop: "1.5px solid transparent", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />}
    </div>
    <span style={{ color: T.text, fontWeight: 500, fontFamily: T.mono, fontSize: 11 }}>{name}</span>
    <span style={{ color: T.faint, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{detail}</span>
    <span style={{ color: status === "done" ? T.ok : T.accent, fontSize: 10 }}>{status === "done" ? "done" : "running"}</span>
  </div>
);

const ContextChip = ({ label, type }) => {
  const c = { file: T.accent, folder: T.accent2, symbol: T.sage, url: "#7ab8d4" }[type] || T.accent;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "2px 7px", borderRadius: 5, fontSize: 10.5, color: c, background: `${c}14`, border: `1px solid ${c}22`, fontFamily: T.mono }}>
      <I d={type === "file" ? ic.file : type === "folder" ? ic.folder : ic.code} size={9} color={c} />
      {label}
    </span>
  );
};

const TaskRow = ({ label, status, sub }) => {
  const cfg = { done: { c: T.ok, i: "✓" }, running: { c: T.accent, i: "●" }, pending: { c: T.faint, i: "○" } }[status];
  return (
    <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "5px 0" }}>
      <span style={{ color: cfg.c, fontSize: 11, marginTop: 2, animation: status === "running" ? "pulse 1.5s infinite" : "none" }}>{cfg.i}</span>
      <div>
        <div style={{ fontSize: 12, color: status === "pending" ? T.faint : T.text }}>{label}</div>
        {sub && <div style={{ fontSize: 10.5, color: T.faint, marginTop: 1 }}>{sub}</div>}
      </div>
    </div>
  );
};

/* === Main App === */
function PiwinShell() {
  const [navOpen, setNavOpen] = useState(true);
  const [rightOpen, setRightOpen] = useState(false);
  const [rightTab, setRightTab] = useState("activity");
  const [activeTask, setActiveTask] = useState(0);
  const [input, setInput] = useState("");

  const tasks = [
    { id: 0, name: "OAuth2 集成", status: "running" },
    { id: 1, name: "修复 #342 内存泄漏", status: "done" },
    { id: 2, name: "重构 DB 连接池", status: "pending" },
  ];

  return (
    <div style={{ width: "100%", height: "100vh", display: "flex", flexDirection: "column", background: T.canvas, color: T.text, fontFamily: T.font, fontSize: 13, lineHeight: 1.45, overflow: "hidden", letterSpacing: "-0.01em" }}>

      {/* === Titleband (macOS overlay style) === */}
      <div style={{ height: 36, display: "flex", alignItems: "center", gap: 5, padding: "0 42px 0 76px", background: navOpen ? `linear-gradient(to right, ${T.sidebar} 0, ${T.sidebar} 260px, ${T.canvas} 260px, ${T.canvas} 100%)` : T.canvas, borderBottom: "none", position: "relative", flexShrink: 0, zIndex: 10 }}>
        {/* Traffic lights (decorative) */}
        <div style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", display: "flex", gap: 7 }}>
          <div style={{ width: 11, height: 11, borderRadius: "50%", background: "#ff5f57" }} />
          <div style={{ width: 11, height: 11, borderRadius: "50%", background: "#febc2e" }} />
          <div style={{ width: 11, height: 11, borderRadius: "50%", background: "#28c840" }} />
        </div>
        {/* Nav toggle */}
        <button onClick={() => setNavOpen(!navOpen)} style={{ width: 28, height: 28, display: "grid", placeItems: "center", border: "none", borderRadius: 6, background: "transparent", color: T.text, cursor: "pointer" }}>
          <I d={ic.panelL} size={14} color={navOpen ? T.text : T.muted} />
        </button>
        {/* History nav */}
        <div style={{ display: "flex", gap: 2, marginLeft: 4 }}>
          <button style={{ width: 24, height: 24, display: "grid", placeItems: "center", border: "none", borderRadius: 5, background: "transparent", cursor: "pointer" }}><I d={ic.back} size={12} color={T.faint} /></button>
          <button style={{ width: 24, height: 24, display: "grid", placeItems: "center", border: "none", borderRadius: 5, background: "transparent", cursor: "pointer" }}><I d={ic.fwd} size={12} color="rgba(111,103,93,0.4)" /></button>
        </div>
        {/* Search */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, flex: "1 1 280px", maxWidth: 420, height: 30, padding: "0 12px", border: `1px solid ${T.lineSoft}`, borderRadius: 11, color: T.faint, background: T.panel2, fontSize: 12, cursor: "pointer", marginLeft: 8 }}>
          <I d={ic.search} size={12} color={T.faint} />
          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>Search or ask...</span>
          <kbd style={{ marginLeft: "auto", padding: "2px 6px", border: `1px solid ${T.lineSoft}`, borderRadius: 5, fontSize: 10, color: T.faint }}>⌘K</kbd>
        </div>
        <div style={{ flex: 1 }} />
        {/* Right panel toggle */}
        <button onClick={() => setRightOpen(!rightOpen)} style={{ width: 28, height: 28, display: "grid", placeItems: "center", border: "none", borderRadius: 6, background: rightOpen ? T.accentSoft : "transparent", cursor: "pointer" }}>
          <I d={ic.panelR} size={14} color={rightOpen ? T.accent2 : T.muted} />
        </button>
        {/* Settings */}
        <button style={{ width: 28, height: 28, display: "grid", placeItems: "center", border: "none", borderRadius: 6, background: "transparent", cursor: "pointer" }}>
          <I d={ic.settings} size={14} color={T.muted} />
        </button>
      </div>

      {/* === Body === */}
      <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>

        {/* === Left Sidebar (Navigator) === */}
        {navOpen && (
          <div style={{ width: 260, display: "flex", flexDirection: "column", background: T.sidebar, borderRight: `1px solid ${T.lineSoft}`, flexShrink: 0, overflow: "hidden" }}>
            {/* Brand + Project */}
            <div style={{ padding: "12px 12px 8px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                <div style={{ width: 28, height: 28, borderRadius: 9, display: "grid", placeItems: "center", background: `linear-gradient(180deg, ${T.accent2}, ${T.accent})`, color: "#1a140e", fontSize: 14, fontWeight: 750, boxShadow: "0 0 0 1px rgba(216,154,74,0.28)" }}>π</div>
                <strong style={{ fontSize: 14, fontWeight: 650, letterSpacing: "-0.02em" }}>piwin</strong>
              </div>
              {/* Project card */}
              <button style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: 10, border: `1px solid ${T.lineSoft}`, borderRadius: 12, background: "linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015))", cursor: "pointer", textAlign: "left", color: "inherit" }}>
                <div style={{ width: 32, height: 32, borderRadius: 9, display: "grid", placeItems: "center", color: T.accent2, background: T.accentSoft, fontWeight: 700, fontSize: 13 }}>A</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 620, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>acme-api</div>
                  <div style={{ fontSize: 11, color: T.faint, fontFamily: T.mono }}>~/Projects/acme-api</div>
                </div>
                <I d={ic.chevD} size={14} color={T.faint} />
              </button>
            </div>

            {/* Search sessions */}
            <div style={{ padding: "0 12px 8px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, height: 34, padding: "0 10px", border: `1px solid ${T.lineSoft}`, borderRadius: 9, background: T.panel2, color: T.faint, fontSize: 12 }}>
                <I d={ic.search} size={12} />
                <input placeholder="Search conversations" style={{ flex: 1, border: 0, outline: 0, background: "transparent", color: T.text, font: "inherit", fontSize: 12 }} />
              </div>
            </div>
