<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 2D 极简纯平全身躺平招财猫 (Full-body Lounging Cat) -->
  <g transform="translate(0, 20)">
    <!-- 翘起的高高猫尾巴 -->
    <path d="M 370,320 C 450,300 440,180 370,180 C 340,180 340,210 360,210 C 400,210 400,280 350,290 Z" fill="#D97706"/>

    <!-- 侧卧肉乎乎猫咪身体 -->
    <path d="M 140,320 C 120,250 180,210 260,210 L 330,210 C 390,210 410,270 390,340 C 370,390 300,400 240,400 L 180,400 C 140,400 140,350 140,320 Z" fill="#F59E0B"/>

    <!-- 浅色肚皮 -->
    <path d="M 190,400 C 180,330 240,300 300,300 C 360,300 370,350 360,400 Z" fill="#FFFBEB"/>

    <!-- 猫咪圆头 -->
    <path d="M 110,240 C 100,160 160,130 220,130 C 270,130 280,170 270,230 C 260,280 200,290 140,280 C 110,280 110,250 110,240 Z" fill="#F59E0B"/>

    <!-- 尖耳朵 -->
    <path d="M 145,150 L 175,70 L 215,135 Z" fill="#F59E0B"/>
    <path d="M 160,140 L 180,90 L 205,135 Z" fill="#FDE68A"/>
    <path d="M 235,150 L 265,80 L 285,145 Z" fill="#F59E0B"/>

    <!-- 猫胡须 -->
    <line x1="80" y1="240" x2="120" y2="242" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
    <line x1="75" y1="260" x2="118" y2="258" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>

    <!-- 粉鼻子与 3 字笑嘴 -->
    <polygon points="135,235 125,225 145,225" fill="#F43F5E"/>
    <path d="M 125,248 Q 135,260 145,248" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>

    <!-- 酷黑墨镜 -->
    <g transform="translate(-15, -15)">
      <path d="M 135,178 L 195,178 C 198,202 184,215 152,215 C 138,215 132,198 135,178 Z" fill="#0F172A"/>
      <path d="M 215,178 L 265,178 C 270,198 262,215 245,215 C 220,215 212,202 215,178 Z" fill="#0F172A"/>
      <rect x="190" y="182" width="30" height="6" fill="#0F172A"/>
      <line x1="145" y1="184" x2="170" y2="184" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <line x1="225" y1="184" x2="250" y2="184" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 惬意的小爪爪 -->
    <ellipse cx="220" cy="315" rx="20" ry="16" fill="#F59E0B"/>
  </g>
</svg>
