<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 2D 极简纯平全身翘脚大佬柴犬 (Full-body Seated Shiba) -->
  <g transform="translate(10, 15)">
    <!-- 立耳 -->
    <path d="M 170,170 L 210,80 L 250,150 Z" fill="#EA580C"/>
    <path d="M 185,160 L 210,98 L 235,150 Z" fill="#FFEDD5"/>
    <path d="M 342,170 L 302,80 L 262,150 Z" fill="#EA580C"/>
    <path d="M 327,160 L 302,98 L 277,150 Z" fill="#FFEDD5"/>

    <!-- 坐姿身躯 -->
    <path d="M 180,240 C 180,180 332,180 332,240 C 340,320 370,360 370,400 C 370,430 140,430 142,400 C 142,360 172,320 180,240 Z" fill="#F97316"/>

    <!-- 胸口与肚皮白色腹斑 -->
    <path d="M 215,250 C 215,220 297,220 297,250 C 310,330 315,425 256,425 C 197,425 202,330 215,250 Z" fill="#FFFFFF"/>

    <!-- 头部轮廓 -->
    <path d="M 175,200 C 175,130 337,130 337,200 C 337,260 300,285 256,285 C 212,285 175,260 175,200 Z" fill="#F97316"/>

    <!-- 白吻部 -->
    <path d="M 205,225 C 205,195 307,195 307,225 C 307,275 285,285 256,285 C 227,285 205,275 205,225 Z" fill="#FFFFFF"/>

    <!-- 黑鼻子 -->
    <ellipse cx="256" cy="225" rx="18" ry="12" fill="#0F172A"/>

    <!-- 得意笑嘴 -->
    <path d="M 235,248 Q 256,268 277,248" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>

    <!-- 抱手臂/翘脚姿态 (大佬环抱手势) -->
    <path d="M 160,330 Q 256,380 352,330" fill="none" stroke="#EA580C" stroke-width="26" stroke-linecap="round"/>
    <path d="M 160,330 Q 256,380 352,330" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

    <!-- 2D 酷黑墨镜 -->
    <g transform="translate(0, -10)">
      <path d="M 175,175 L 242,175 C 246,205 230,220 188,220 C 175,220 170,200 175,175 Z" fill="#0F172A"/>
      <path d="M 270,175 L 337,175 C 342,200 337,220 324,220 C 282,220 266,205 270,175 Z" fill="#0F172A"/>
      <rect x="238" y="180" width="36" height="6" fill="#0F172A"/>
      <line x1="185" y1="182" x2="215" y2="182" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <line x1="280" y1="182" x2="310" y2="182" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
