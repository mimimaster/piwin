<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 主体渐变：金黄与温暖皮毛质感 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#E98A15"/>
    </linearGradient>
    
    <!-- 肚皮与吻部浅色渐变 -->
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E4"/>
      <stop offset="100%" stop-color="#FFE2A4"/>
    </linearGradient>

    <!-- 纯金皇冠与金币渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE875"/>
      <stop offset="50%" stop-color="#F7B500"/>
      <stop offset="100%" stop-color="#D48800"/>
    </linearGradient>

    <!-- 祥瑞龙角渐变 (紫金神兽感) -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>

    <!-- 宝石红渐变 -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#9E0059"/>
    </linearGradient>

    <!-- 墨镜渐变 (大佬质感) -->
    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2D42"/>
      <stop offset="100%" stop-color="#11111E"/>
    </linearGradient>

    <!-- 柔和立体阴影 -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- 胜利光芒发光效果 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 图标核心内容 (整体自带投影与居中布局) -->
  <g filter="url(#softShadow)">
    
    <!-- 1. 四不像特征之：胜利金翅 / 祥瑞光环 (背景元素) -->
    <path d="M 130,270 C 60,230 50,160 115,150 C 145,145 168,170 178,200 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M 382,270 C 452,230 462,160 397,150 C 367,145 344,170 334,200 Z" fill="url(#goldGrad)" opacity="0.9"/>

    <!-- 2. 四不像特征之：卡皮巴拉/福兽圆润身体 -->
    <ellipse cx="256" cy="350" rx="135" ry="105" fill="url(#bodyGrad)"/>
    <ellipse cx="256" cy="358" rx="92" ry="82" fill="url(#bellyGrad)"/>

    <!-- 3. 左爪：抱着的“WIN”纯金大金币 -->
    <g transform="translate(140, 335)">
      <circle cx="15" cy="15" r="26" fill="url(#bodyGrad)"/>
      <circle cx="-5" cy="5" r="34" fill="url(#goldGrad)" stroke="#B37400" stroke-width="3"/>
      <circle cx="-5" cy="5" r="26" fill="none" stroke="#FFE875" stroke-width="2" stroke-dasharray="6,3"/>
      <text x="-5" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#78350F" text-anchor="middle">WIN</text>
    </g>

    <!-- 4. 右爪：比出 ✌️ 胜利手势 -->
    <g transform="translate(345, 315)">
      <circle cx="20" cy="25" r="25" fill="url(#bodyGrad)"/>
      <rect x="8" y="-14" width="13" height="30" rx="6.5" fill="url(#bodyGrad)" transform="rotate(-18, 14, 2)"/>
      <rect x="25" y="-12" width="13" height="30" rx="6.5" fill="url(#bodyGrad)" transform="rotate(18, 31, 3)"/>
    </g>

    <!-- 5. 头部 base -->
    <path d="M 156,225 C 156,145 200,118 256,118 C 312,118 356,145 356,225 C 356,295 312,315 256,315 C 200,315 156,295 156,225 Z" fill="url(#bodyGrad)"/>

    <!-- 6. 耳朵 (圆润卡皮巴拉/熊耳) -->
    <circle cx="160" cy="140" r="26" fill="url(#bodyGrad)"/>
    <circle cx="160" cy="140" r="15" fill="#E98A15"/>
    <circle cx="352" cy="140" r="26" fill="url(#bodyGrad)"/>
    <circle cx="352" cy="140" r="15" fill="#E98A15"/>

    <!-- 7. 四不像特征之：祥瑞紫金龙角 (象征赢麻了的运气爆棚) -->
    <path d="M 195,128 C 182,85 200,62 216,58 C 210,80 215,96 223,110 Z" fill="url(#hornGrad)"/>
    <path d="M 317,128 C 330,85 312,62 296,58 C 302,80 297,96 289,110 Z" fill="url(#hornGrad)"/>

    <!-- 8. 吻部与鼻子 -->
    <ellipse cx="256" cy="232" rx="64" ry="46" fill="url(#bellyGrad)"/>
    <path d="M 244,202 C 244,195 268,195 268,202 C 268,212 256,220 256,220 C 256,220 244,212 244,202 Z" fill="#4A2810"/>

    <!-- 9. “赢麻了”核心表情：沉醉笑眼 + 醉怡惬意的微笑 -->
    <!-- 舒爽闭眼笑弧 (在墨镜上方/透出) -->
    <path d="M 188,192 Q 210,170 232,192" fill="none" stroke="#3D2008" stroke-width="7" stroke-linecap="round"/>
    <path d="M 280,192 Q 302,170 324,192" fill="none" stroke="#3D2008" stroke-width="7" stroke-linecap="round"/>
    
    <!-- “麻了”表情：微微向上咧开的超惬意嘴角 -->
    <path d="M 236,232 Q 256,250 276,232" fill="none" stroke="#3D2008" stroke-width="5.5" stroke-linecap="round"/>

    <!-- 红润腮红 (赢到气色红润) -->
    <ellipse cx="182" cy="222" rx="20" ry="12" fill="#FF5964" opacity="0.5"/>
    <ellipse cx="330" cy="222" rx="20" ry="12" fill="#FF5964" opacity="0.5"/>

    <!-- 10. 酷炫大佬墨镜 (可透视笑眼，极具大佬范儿) -->
    <g transform="translate(0, 4)">
      <!-- 左镜片 -->
      <path d="M 172,175 L 236,175 C 240,198 226,212 184,212 C 172,212 168,195 172,175 Z" fill="url(#glassesGrad)" opacity="0.9"/>
      <!-- 右镜片 -->
      <path d="M 276,175 L 340,175 C 344,195 340,212 298,212 C 286,212 272,198 276,175 Z" fill="url(#glassesGrad)" opacity="0.9"/>
      <!-- 镜梁 -->
      <rect x="233" y="180" width="46" height="6" rx="3" fill="#11111E"/>
      <!-- 镜片反光 (金色/高光) -->
      <path d="M 180,181 L 204,181 L 190,206 L 176,206 Z" fill="#FFF" opacity="0.4"/>
      <path d="M 284,181 L 308,181 L 294,206 L 280,206 Z" fill="#FFF" opacity="0.4"/>
    </g>

    <!-- 11. 头顶胜利皇冠 (带红绿宝石) -->
    <g transform="translate(256, 100)" filter="url(#glow)">
      <!-- 皇冠主体 -->
      <path d="M -46,-10 L 46,-10 L 36,-46 L 18,-26 L 0,-58 L -18,-26 L -36,-46 Z" fill="url(#goldGrad)" stroke="#B37400" stroke-width="2"/>
      <!-- 顶部宝石 -->
      <circle cx="0" cy="-58" r="7.5" fill="url(#rubyGrad)"/>
      <circle cx="-36" cy="-46" r="5.5" fill="url(#rubyGrad)"/>
      <circle cx="36" cy="-46" r="5.5" fill="url(#rubyGrad)"/>
      <!-- 底座镶边 -->
      <rect x="-40" y="-12" width="80" height="8" rx="4" fill="#FFD000"/>
      <circle cx="-22" cy="-8" r="3" fill="#00C49F"/>
      <circle cx="0" cy="-8" r="3.5" fill="url(#rubyGrad)"/>
      <circle cx="22" cy="-8" r="3" fill="#00C49F"/>
    </g>

    <!-- 12. 周围璀璨的胜利闪光/星星 -->
    <path d="M 115,100 L 120,114 L 134,116 L 123,126 L 127,140 L 115,131 L 103,140 L 107,126 L 96,116 L 110,114 Z" fill="#FFE066"/>
    <path d="M 390,95 L 394,105 L 405,106 L 397,113 L 400,123 L 390,117 L 380,123 L 383,113 L 375,106 L 386,105 Z" fill="#FFE066"/>
    <path d="M 256,22 L 260,33 L 271,35 L 262,42 L 265,53 L 256,46 L 247,53 L 250,42 L 241,35 L 252,33 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
