<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- macOS 软件图标级：Docker 风格霸气金宝鲸 (Docker Whale Mascot) -->
  <defs>
    <linearGradient id="whaleBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="whaleBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="macShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#macShadow)">
    <!-- 尾巴 (向右翘起) -->
    <path d="M 370,300 C 440,280 460,200 420,180 C 390,170 380,210 370,250 Z" fill="url(#whaleBody)"/>

    <!-- 鲸鱼大身躯 (圆润 3D 向量造型，类似 Docker 鲸) -->
    <path d="M 90,290 C 80,200 160,170 260,170 L 360,170 C 410,170 430,240 400,310 C 370,370 290,380 220,380 L 160,380 C 110,380 95,340 90,290 Z" fill="url(#whaleBody)"/>

    <!-- 肚皮 -->
    <path d="M 130,320 C 120,360 170,380 230,380 L 330,380 C 370,370 380,340 370,320 Z" fill="#CBD5E1"/>

    <!-- 喷水口喷出的胜利金星 -->
    <path d="M 230,120 L 235,135 L 250,137 L 238,147 L 242,162 L 230,152 L 218,162 L 222,147 L 210,137 L 225,135 Z" fill="url(#goldCrown)"/>

    <!-- 头部酷黑墨镜 -->
    <g transform="translate(-10, -5)">
      <path d="M 115,215 L 195,215 C 200,245 182,260 138,260 C 120,260 110,240 115,215 Z" fill="#0F172A"/>
      <path d="M 208,215 L 255,215 C 260,240 250,256 230,256 C 208,256 205,240 208,215 Z" fill="#0F172A"/>
      <rect x="190" y="220" width="22" height="6" fill="#0F172A"/>
      <line x1="125" y1="222" x2="160" y2="222" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <line x1="216" y1="222" x2="238" y2="222" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 得意笑嘴 -->
    <path d="M 135,282 Q 160,300 185,282" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>

    <!-- 背上驮着的“WIN”纯金宝箱/集装箱 (致敬 Docker 集装箱) -->
    <g transform="translate(280, 115)">
      <rect x="0" y="0" width="70" height="50" rx="10" fill="url(#goldCrown)" stroke="#B45309" stroke-width="3"/>
      <text x="35" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#78350F" text-anchor="middle">WIN</text>
    </g>
  </g>
</svg>
