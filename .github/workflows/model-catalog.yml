name: model-catalog

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh bundled models.dev snapshot
        run: node scripts/refresh-model-catalog.mjs
      - name: Commit when the snapshot changed
        run: |
          git config user.name "piwin-bot"
          git config user.email "piwin-bot@users.noreply.github.com"
          git add packages/host-runtime/bundled/model-catalog/model-catalog.json
          if git diff --cached --quiet; then
            echo "catalog unchanged"
            exit 0
          fi
          git commit -m "chore: refresh bundled model catalog"
          git push
