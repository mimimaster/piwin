<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- macOS 顶级软件图标级：金水豚神兽 (macOS Native Capybara Mascot) -->
  <defs>
    <linearGradient id="capyFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="capyBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="glassesGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="macShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#macShadow)">
    <!-- 圆耳 -->
    <circle cx="160" cy="155" r="32" fill="#D97706"/>
    <circle cx="160" cy="155" r="18" fill="#92400E"/>
    <circle cx="352" cy="155" r="32" fill="#D97706"/>
    <circle cx="352" cy="155" r="18" fill="#92400E"/>

    <!-- 正面水豚身躯与头部 -->
    <path d="M 150,230 C 150,135 195,105 256,105 C 317,105 362,135 362,230 C 362,340 325,430 256,430 C 187,430 150,340 150,230 Z" fill="url(#capyFur)"/>

    <!-- 圆肚皮与浅色吻部一体化 -->
    <path d="M 180,260 C 180,185 220,175 256,175 C 292,175 332,185 332,260 C 332,350 300,415 256,415 C 212,415 180,350 180,260 Z" fill="url(#capyBelly)"/>

    <!-- 鼻子 -->
    <path d="M 238,225 C 238,216 274,216 274,225 C 274,240 256,252 256,252 Z" fill="#78350F"/>

    <!-- 得意笑嘴 -->
    <path d="M 230,270 Q 256,292 282,270" fill="none" stroke="#78350F" stroke-width="7" stroke-linecap="round"/>

    <!-- 酷炫黑墨镜 -->
    <g transform="translate(0, -10)">
      <path d="M 162,170 L 242,170 C 246,205 230,222 185,222 C 168,222 158,200 162,170 Z" fill="url(#glassesGloss)"/>
      <path d="M 270,170 L 350,170 C 354,200 344,222 327,222 C 282,222 266,205 270,170 Z" fill="url(#glassesGloss)"/>
      <rect x="238" y="174" width="36" height="8" rx="4" fill="#020617"/>
      <!-- 白色高光线 -->
      <path d="M 172,175 L 205,175 L 188,212 L 170,212 Z" fill="#FFFFFF" opacity="0.4"/>
      <path d="M 280,175 L 313,175 L 296,212 L 278,212 Z" fill="#FFFFFF" opacity="0.4"/>
    </g>

    <!-- 纯金微型皇冠 (加盖在头顶) -->
    <g transform="translate(256, 92)">
      <path d="M -26,0 L 26,0 L 20,-24 L 10,-12 L 0,-32 L -10,-12 L -20,-24 Z" fill="url(#crownGold)" stroke="#B45309" stroke-width="2"/>
      <circle cx="0" cy="-32" r="4.5" fill="#EF4444"/>
      <circle cx="-20" cy="-24" r="3.5" fill="#EF4444"/>
      <circle cx="20" cy="-24" r="3.5" fill="#EF4444"/>
    </g>
  </g>
</svg>
