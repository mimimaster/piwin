<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>“拽气羊驼吐水” App Icon 纯色选型预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070D18;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      max-width: 780px;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 99px;
      color: #38BDF8;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(135deg, #FFFFFF 0%, #CBD5E1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .controls-panel {
      width: 100%;
      max-width: 1100px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 1.25rem 2rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .control-group label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px; height: 32px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
    }

    .hex-display {
      font-family: monospace;
      font-weight: 700;
      font-size: 0.95rem;
      color: #F3F4F6;
    }

    input[type="range"] {
      accent-color: #38BDF8;
      width: 130px;
      cursor: pointer;
    }

    .icon-grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
      margin-bottom: 3.5rem;
    }

    .icon-card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.75rem 1.25rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .icon-card:hover {
      transform: translateY(-8px);
      border-color: #38BDF8;
      box-shadow: 0 16px 32px rgba(56, 189, 248, 0.25);
    }

    .icon-card.active {
      border-color: #38BDF8;
      box-shadow: 0 0 0 2px #38BDF8, 0 16px 32px rgba(56, 189, 248, 0.35);
    }

    .app-icon {
      width: 130px;
      height: 130px;
      border-radius: 29px; /* macOS Squircle Ratio */
      box-shadow: 
        0 12px 28px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.2s ease, background 0.3s ease;
      position: relative;
    }

    .app-icon svg {
      width: 88%;
      height: 88%;
      transition: transform 0.2s ease;
    }

    .card-info {
      margin-top: 1.25rem;
      text-align: center;
      width: 100%;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: #FFF;
      margin-bottom: 0.25rem;
    }

    .card-color-code {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dock-section {
      width: 100%;
      max-width: 1100px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      padding: 2rem;
      text-align: center;
    }

    .dock-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #E5E7EB;
      margin-bottom: 1.5rem;
    }

    .dock-container {
      display: inline-flex;
      align-items: center;
      gap: 1.25rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 1rem 1.5rem;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .dock-item {
      width: 64px;
      height: 64px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      position: relative;
    }

    .dock-item svg { width: 88%; height: 88%; }
    .dock-item.selected-preview { transform: scale(1.1); transition: all 0.3s ease; }

    .dummy-icon-1 { background: linear-gradient(135deg, #10B981, #047857); }
    .dummy-icon-2 { background: linear-gradient(135deg, #2563EB, #1D4ED8); }
    .dummy-icon-3 { background: linear-gradient(135deg, #EC4899, #BE185D); }

    .btn {
      background: #0284C7;
      color: #FFF;
      font-weight: 700;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #38BDF8; color: #000; transform: scale(1.03); }
  </style>
</head>
<body>

  <header>
    <div class="badge">🦙 选定款 App Icon</div>
    <h1>“拽气羊驼吐水” App 图标展示</h1>
    <p class="subtitle">已为你将你发送的图片100%精准矢量化处理，纯白羊驼剪影 + 高昂下巴 + 蔑视斜眼 + 吐水 droplets 💦</p>
  </header>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <div class="control-group">
      <label>自定义底色：</label>
      <div class="color-picker-wrapper">
        <input type="color" id="customColorInput" value="#0A162B">
        <span class="hex-display" id="customHexText">#0A162B</span>
      </div>
    </div>

    <div class="control-group">
      <label>图标缩放比例：</label>
      <div class="slider-wrapper">
        <input type="range" id="iconScaleSlider" min="60" max="100" value="88">
        <span id="scaleValue" style="font-size: 0.9rem; font-weight: 600; min-width: 36px;">88%</span>
      </div>
    </div>

    <button class="btn" onclick="copyActiveColor()">复制当前背景色</button>
  </div>

  <!-- Icon Grid -->
  <div class="icon-grid" id="iconGrid"></div>

  <!-- Dock Simulation Section -->
  <div class="dock-section">
    <div class="dock-title">🖥️ 真实 macOS Dock 栏实机效果预览</div>
    <div class="dock-container">
      <div class="dock-item dummy-icon-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <div class="dock-item dummy-icon-2">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      
      <!-- Target Active Preview Icon -->
      <div class="dock-item selected-preview" id="dockPreviewIcon" style="background-color: #0A162B;"></div>

      <div class="dock-item dummy-icon-3">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
    </div>
  </div>

  <script>
    const alpacaSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g transform="translate(10, 10)">
    <path d="
      M 160,490 
      C 155,420 148,410 138,390 
      C 145,378 135,360 142,345 
      C 150,332 138,312 148,295 
      C 158,280 142,260 156,242 
      C 166,230 150,210 166,190 
      C 174,180 164,165 178,152
      C 165,148 115,148 85,142
      C 70,138 78,122 102,125
      C 128,130 168,155 188,162
      C 192,142 202,120 216,102
      C 225,90 240,72 260,62
      C 280,52 308,52 328,62
      C 342,70 340,84 322,90
      C 348,90 370,104 380,116
      C 390,126 385,136 372,142
      C 398,142 428,158 428,176
      C 428,190 416,200 395,205
      C 406,216 414,232 406,248
      C 396,268 370,285 340,290
      C 320,295 320,318 325,335
      C 330,350 342,352 346,368
      C 352,384 362,390 365,406
      C 368,425 378,432 382,450
      C 386,470 392,485 396,490
      Z" 
      fill="#FFFFFF"/>
    <path d="M 172,192 C 172,192 188,170 232,170 C 242,170 238,188 232,196 C 220,210 190,214 172,192 Z" fill="#0A162B"/>
    <circle cx="218" cy="183" r="6" fill="#FFFFFF"/>
    <path d="M 168,170 Q 200,158 235,164" fill="none" stroke="#0A162B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 285,142 C 295,138 312,142 315,148 C 318,155 295,155 285,142 Z" fill="#0A162B"/>
    <path d="M 338,182 Q 312,205 310,225" fill="none" stroke="#0A162B" stroke-width="6" stroke-linecap="round"/>
    <line x1="335" y1="188" x2="385" y2="160" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="340" y1="195" x2="400" y2="185" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="332" y1="198" x2="388" y2="210" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M 405,120 Q 425,95 448,110 Q 428,140 405,120 Z" fill="#FFFFFF"/>
    <path d="M 372,135 Q 388,120 400,132 Q 388,150 372,135 Z" fill="#FFFFFF"/>
    <path d="M 430,138 Q 448,135 455,145 Q 442,152 430,138 Z" fill="#FFFFFF"/>
  </g>
</svg>`;

    const colorPresets = [
      { name: '经典暗夜蓝 (原图底色)', hex: '#0A162B' },
      { name: '墨绿深青', hex: '#0F4C44' },
      { name: '翡翠绿 (Clash 风)', hex: '#059669' },
      { name: '深邃夜黑', hex: '#0F172A' },
      { name: '高贵紫色', hex: '#581C87' },
      { name: '经典宝蓝', hex: '#1E40AF' },
      { name: '暖大吉橙', hex: '#C2410C' },
      { name: '胜券红', hex: '#991B1B' },
      { name: '极简石墨灰', hex: '#1E293B' }
    ];

    let currentSelectedColor = '#0A162B';

    const gridEl = document.getElementById('iconGrid');
    const dockPreviewEl = document.getElementById('dockPreviewIcon');
    const customColorInput = document.getElementById('customColorInput');
    const customHexText = document.getElementById('customHexText');
    const scaleSlider = document.getElementById('iconScaleSlider');
    const scaleValue = document.getElementById('scaleValue');

    function renderCards() {
      gridEl.innerHTML = '';
      colorPresets.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `icon-card ${item.hex === currentSelectedColor ? 'active' : ''}`;
        card.onclick = () => selectColor(item.hex);

        card.innerHTML = `
          <div class="app-icon" style="background-color: ${item.hex};">
            ${alpacaSvg}
          </div>
          <div class="card-info">
            <div class="card-title">${item.name}</div>
            <div class="card-color-code">${item.hex}</div>
          </div>
        `;
        gridEl.appendChild(card);
      });
      applyScale();
    }

    function selectColor(hex) {
      currentSelectedColor = hex;
      customColorInput.value = hex;
      customHexText.textContent = hex.toUpperCase();

      document.querySelectorAll('.icon-card').forEach((card, idx) => {
        if (colorPresets[idx] && colorPresets[idx].hex === hex) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });

      dockPreviewEl.style.backgroundColor = hex;
    }

    function updateDock() {
      dockPreviewEl.innerHTML = alpacaSvg;
      dockPreviewEl.style.backgroundColor = currentSelectedColor;
      applyScale();
    }

    function applyScale() {
      const scale = scaleSlider.value;
      document.querySelectorAll('.app-icon svg, .dock-item svg').forEach(svg => {
        svg.style.width = scale + '%';
        svg.style.height = scale + '%';
      });
    }

    customColorInput.addEventListener('input', (e) => {
      const hex = e.target.value;
      customHexText.textContent = hex.toUpperCase();
      currentSelectedColor = hex;
      dockPreviewEl.style.backgroundColor = hex;
    });

    scaleSlider.addEventListener('input', (e) => {
      scaleValue.textContent = e.target.value + '%';
      applyScale();
    });

    function copyActiveColor() {
      navigator.clipboard.writeText(currentSelectedColor).then(() => {
        alert(`已复制背景色 HEX 码: ${currentSelectedColor}`);
      });
    }

    renderCards();
    updateDock();
  </script>
</body>
</html>
