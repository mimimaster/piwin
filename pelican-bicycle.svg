<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="鹈鹕骑自行车">
  <defs>
    <style>
      .ink { stroke:#1a1a18; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- ground -->
  <path d="M40 430h640" class="ink" fill="none" stroke-width="10"/>
  <path d="M80 458h560" class="ink" fill="none" stroke-width="4" opacity=".35"/>

  <!-- rear wheel -->
  <g class="ink" fill="none">
    <circle cx="210" cy="390" r="78" stroke-width="12"/>
    <circle cx="210" cy="390" r="14" fill="#1a1a18" stroke="none"/>
    <path d="M210 312v156M132 390h156M156 336l108 108M156 444l108-108" stroke-width="3"/>
  </g>

  <!-- front wheel -->
  <g class="ink" fill="none">
    <circle cx="510" cy="390" r="78" stroke-width="12"/>
    <circle cx="510" cy="390" r="14" fill="#1a1a18" stroke="none"/>
    <path d="M510 312v156M432 390h156M456 336l108 108M456 444l108-108" stroke-width="3"/>
  </g>

  <!-- frame -->
  <g class="ink" fill="none" stroke-width="11">
    <path d="M210 390 L320 250 L430 390 Z"/>
    <path d="M320 250 L510 390"/>
    <path d="M430 390 L320 250"/>
  </g>
  <path class="ink" fill="none" stroke-width="10" d="M320 250 L308 208 H268"/>
  <path class="ink" fill="none" stroke-width="12" d="M256 208 H318"/>
  <path class="ink" fill="none" stroke-width="10" d="M510 390 L528 248 H572 L556 228"/>
  <circle class="ink" cx="430" cy="390" r="16" fill="#f2c14e" stroke-width="7"/>
  <path class="ink" fill="none" stroke-width="7" d="M430 390 L462 412 M430 390 L400 368"/>

  <!-- pelican body -->
  <ellipse class="ink" cx="338" cy="198" rx="86" ry="70" fill="#f6f1e4" stroke-width="8"/>
  <!-- folded neck -->
  <path class="ink" fill="#f6f1e4" stroke-width="8" d="M270 168 C240 150 228 118 248 96 C268 74 300 80 312 104 C322 124 318 150 300 168 Z"/>
  <!-- head -->
  <ellipse class="ink" cx="292" cy="88" rx="42" ry="36" fill="#f6f1e4" stroke-width="8"/>
  <!-- eye -->
  <circle cx="304" cy="82" r="6" fill="#1a1a18"/>
  <circle cx="306" cy="80" r="2" fill="#fff"/>
  <!-- beak + pouch: the whole joke -->
  <path class="ink" fill="#e07a2f" stroke-width="7" d="M328 86 C390 78 470 96 520 128 C470 168 390 176 328 150 C312 140 312 112 328 86 Z"/>
  <path class="ink" fill="none" stroke-width="4" d="M340 128 C390 138 450 140 500 128"/>
  <path class="ink" fill="#c45a1c" stroke-width="5" d="M508 126 L534 132 L508 146 Z"/>
  <!-- wing -->
  <path class="ink" fill="#d9d2c3" stroke-width="7" d="M360 168 C410 150 448 168 454 208 C430 236 390 230 356 210 Z"/>
  <path class="ink" fill="none" stroke-width="4" d="M378 184 C404 176 428 184 438 204"/>
  <!-- legs to pedals -->
  <path class="ink" fill="none" stroke-width="9" d="M360 260 C380 300 400 330 430 390"/>
  <path class="ink" fill="none" stroke-width="9" d="M320 258 C300 310 290 350 400 368"/>
  <!-- webbed feet on pedals -->
  <path class="ink" fill="#e07a2f" stroke-width="5" d="M456 404 C470 396 486 404 490 416 C476 424 460 420 456 404 Z"/>
  <path class="ink" fill="#e07a2f" stroke-width="5" d="M378 356 C364 348 348 356 344 368 C358 376 374 372 378 356 Z"/>
  <!-- tiny bow on handlebar -->
  <path class="ink" fill="#2f6f8f" stroke-width="4" d="M250 200 C236 188 236 176 250 184 C264 176 264 188 250 200 Z"/>
</svg>
